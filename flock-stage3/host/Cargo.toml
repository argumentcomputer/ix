[package]
name = "flock-stage3-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
stage4 = ["dep:ix-terminal-circuit", "dep:ix-fflonk"]

[dependencies]
anyhow = { workspace = true }
aiur = { workspace = true }
bincode = { workspace = true }
blake3 = { workspace = true }
flock-prover = { workspace = true }
ix-terminal = { workspace = true }
ix-stage4-trace = { workspace = true }
ix-terminal-circuit = { workspace = true, optional = true }
ix-fflonk = { workspace = true, optional = true }
multi-stark = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ix-fflonk = { workspace = true }
ix-terminal-circuit = { workspace = true }

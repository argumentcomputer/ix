[package]
name = "ix-prover"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aiur = { workspace = true, features = ["stark"] }
ixvm = { workspace = true, features = ["stark"] }
stark-verifier = { workspace = true }
stark-key = { workspace = true }
ixon = { workspace = true }
aggregate-controller = { workspace = true }
ix-common = { workspace = true }
record-pool = { workspace = true }
multi-stark = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-texray = { workspace = true }
ixvm-native = { path = "../ixvm-native", optional = true }
stark-verifier-native = { path = "../stark-verifier-native", optional = true }

[features]
default = ["parallel"]
parallel = ["aiur/parallel", "ixvm/parallel", "stark-verifier/parallel"]
cuda = ["aiur/cuda", "ixvm/cuda", "stark-verifier/cuda"]
# Compiled CUDA trace writers for the IxVM artifact named by
# AIUR_IXVM_ARTIFACT (see crates/ixvm-tracegen), selected at run time with
# AIUR_GPU_TRACE=compiled. Programs without a bundle stay on their other
# population providers.
compiled-trace = ["cuda", "ixvm/compiled-trace"]
# Generated native executors for IxVM, the recursive verifier and
# aggregation, compiled from the packages named by AIUR_IXVM_ARTIFACT,
# AIUR_VERIFIER_ARTIFACT and AIUR_AGGREGATION_ARTIFACT (`ix prepare` exports
# all three and builds the prover with this feature). A kernel runs jobs
# only for an artifact whose program has exactly its fingerprint; other
# artifacts use the interpreter.
native = [
  "dep:ixvm-native",
  "ixvm-native/kernel",
  "dep:stark-verifier-native",
  "stark-verifier-native/kernel",
  "aiur/native",
]

[lints]
workspace = true

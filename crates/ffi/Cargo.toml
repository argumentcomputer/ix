[package]
name = "ix-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
aggregate-controller = { workspace = true }
aiur = { workspace = true, features = ["stark"] }
blake3 = { workspace = true }
ix-common = { workspace = true }
ixon = { workspace = true }
ix-proof-compression = { path = "../proof-compression", default-features = false }
ix-prover = { path = "../ix-prover", default-features = false }
lean-ffi = { workspace = true }
memmap2 = { workspace = true }
mimalloc = { workspace = true }
multi-stark = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stark-key = { workspace = true }
stark-verifier = { path = "../stark-verifier" }
tiny-keccak = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-texray = { workspace = true }

# Iroh dependencies
tokio = { version = "1.44.1", optional = true }
iroh = { version = "0.97", optional = true }
n0-error = { version = "0.1", optional = true }
getrandom = { version = "0.3", optional = true }
bincode = { version = "2.0.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }

[features]
default = []
# Generated native executors for the formal IxVM, recursive verifier and
# aggregation artifacts named by AIUR_IXVM_ARTIFACT, AIUR_VERIFIER_ARTIFACT
# and AIUR_AGGREGATION_ARTIFACT (see `formalNativeArtifacts` in
# lakefile.lean). Without it the formal prover runs every job on the
# interpreter, which produces identical records.
formal-native = ["ix-prover/native"]
parallel = ["aiur/parallel", "ix-proof-compression/parallel", "ix-prover/parallel"]
cuda = ["aiur/cuda", "ix-proof-compression/cuda", "ix-prover/cuda"]
# Compiled CUDA trace writers for the formal IxVM artifact; needs CUDA and
# AIUR_IXVM_ARTIFACT, as formal-native does.
formal-compiled-trace = ["cuda", "ix-prover/compiled-trace"]
cuda-trace-codegen = ["cuda"]
# Final proof systems, which link the gnark Go archive.
plonk = ["ix-proof-compression/plonk"]
groth16 = ["ix-proof-compression/groth16"]
test-ffi = []
net = ["tokio", "iroh", "n0-error", "getrandom", "bincode"]

[lints]
workspace = true

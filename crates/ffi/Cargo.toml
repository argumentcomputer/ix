[package]
name = "ix-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
aggregate-controller = { workspace = true }
aiur = { workspace = true, features = ["stark"] }
blake3 = { workspace = true }
ix-common = { workspace = true }
ixon = { workspace = true }
ix-proof-compression = { path = "../proof-compression", default-features = false }
ix-prover = { path = "../ix-prover", default-features = false }
lean-ffi = { workspace = true }
memmap2 = { workspace = true }
mimalloc = { workspace = true }
multi-stark = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stark-key = { workspace = true }
stark-verifier = { path = "../stark-verifier" }
tiny-keccak = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-texray = { workspace = true }

# Iroh dependencies
tokio = { version = "1.44.1", optional = true }
iroh = { version = "0.97", optional = true }
n0-error = { version = "0.1", optional = true }
getrandom = { version = "0.3", optional = true }
bincode = { version = "2.0.1", optional = true }
serde = { version = "1.0.219", features = ["derive"] }

[features]
default = []
parallel = ["aiur/parallel", "ix-proof-compression/parallel", "ix-prover/parallel"]
cuda = ["aiur/cuda", "ix-proof-compression/cuda", "ix-prover/cuda"]
# The native executors that `lake build ix` generates from the certified
# formal programs into .lake/build/formal-generated. Without it the formal
# prover runs every job on the interpreter, which produces identical records.
native-executors = ["ix-prover/native"]
# Also the generated compiled CUDA trace writers for formal IxVM; needs nvcc
# and sources generated for a CUDA build.
formal-compiled-trace = ["cuda", "native-executors", "ix-prover/compiled-trace"]
cuda-trace-codegen = ["cuda"]
# Final proof systems, which link the gnark Go archive.
plonk = ["ix-proof-compression/plonk"]
groth16 = ["ix-proof-compression/groth16"]
test-ffi = []
net = ["tokio", "iroh", "n0-error", "getrandom", "bincode"]

[lints]
workspace = true

[package]
name = "ixvm-tracegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compiled CUDA trace writers for IxVM"

# With feature `kernel`, the writers are generated and compiled at build time
# from the binary IxVM artifact named by AIUR_IXVM_ARTIFACT (`ix prepare`
# writes it under .lake/aiur/); AIUR_IXVM_TRACEGEN_CIRCUITS optionally
# selects circuits (a JSON array of names). This needs the CUDA toolkit.
# Without it the crate is empty, so workspace-wide builds need neither CUDA
# nor an artifact. This crate is outside the default workspace members.

[features]
kernel = ["aiur/cuda", "multi-stark/cuda", "dep:aiur-tracegen"]

[dependencies]
aiur = { path = "../aiur" }
multi-stark = { workspace = true }

[build-dependencies]
aiur-tracegen = { path = "../aiur-tracegen", optional = true }

[lints]
workspace = true

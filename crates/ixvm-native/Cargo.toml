[package]
name = "ixvm-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Checks the generated native IxVM executor against the interpreter"

# Diagnostics of the generated native IxVM executor (crates/formal-generated)
# against the interpreter. Feature `generated` compiles it from the sources
# `lake build ix` writes (.lake/build/formal-generated). This crate is outside the default workspace members.

[features]
generated = ["formal-generated/executors"]

[[bin]]
name = "ixvm-native"
required-features = ["generated"]

[dependencies]
aiur = { path = "../aiur", features = ["native", "parallel"] }
formal-generated = { path = "../formal-generated" }
ixvm = { path = "../ixvm" }
multi-stark = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true

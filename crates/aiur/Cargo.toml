[package]
name = "aiur"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
bincode = { version = "2", features = ["serde"] }
hashbrown = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
multi-stark = { workspace = true }
num-bigint = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
tracing-texray = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Exercise the native MMCS at the same Plonky3 revision as multi-stark.
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "3152b14a89067c83775a8076cc262ffc48a1fd7c" }

[features]
default = []
parallel = ["multi-stark/parallel"]
cuda = ["multi-stark/cuda"]
cuda-trace-codegen = ["cuda"]

[lints]
workspace = true

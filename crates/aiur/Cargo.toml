[package]
name = "aiur"
version = "0.1.0"
edition = "2024"
authors = ["Argument Engineering <engineering@argument.xyz>"]
license = "MIT OR Apache-2.0"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
stark-key = { workspace = true, optional = true }
hashbrown = "0.17"
multi-stark = { workspace = true }
rustc-hash = "2.1.2"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
blake3 = "1.8.7"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
function-profile = []
function-profile-ops = ["function-profile"]
trace-profile = ["stark"]
stark = ["dep:stark-key"]
parallel = ["stark", "multi-stark/parallel", "dep:rayon"]
cuda = ["stark", "multi-stark/cuda"]

[[example]]
name = "prove"
required-features = ["stark"]

[[example]]
name = "trie_bench"
required-features = ["stark"]

[[example]]
name = "u32_check"
required-features = ["stark"]

[[example]]
name = "library_check"
required-features = ["stark"]

[package]
name = "aiur"
version = "0.1.0"
edition = "2024"
authors = ["Argument Engineering <engineering@argument.xyz>"]
license = "MIT OR Apache-2.0"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
record-pool = { workspace = true }
stark-key = { workspace = true, optional = true }
# 0.17, newer than the workspace's 0.15.
hashbrown = "0.17"
multi-stark = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
function-profile = []
function-profile-ops = ["function-profile"]
trace-profile = ["stark"]
stark = ["dep:stark-key"]
parallel = ["stark", "multi-stark/parallel", "dep:rayon"]
cuda = ["stark", "multi-stark/cuda"]

[[example]]
name = "prove"
required-features = ["stark"]

[[example]]
name = "trie_bench"
required-features = ["stark"]

[[example]]
name = "u32_check"
required-features = ["stark"]

[[example]]
name = "library_check"
required-features = ["stark"]

[package]
name = "ixvm"
default-run = "ixvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.98"

[dependencies]
aiur = { workspace = true }
multi-stark = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
blake3 = { workspace = true }
ixvm-tracegen = { path = "../ixvm-tracegen", optional = true }

[features]
default = []
stark = ["aiur/stark"]
parallel = ["stark", "aiur/parallel"]
cuda = ["stark", "aiur/cuda"]
# Link the compiled trace writers generated from AIUR_IXVM_ARTIFACT
# (see crates/ixvm-tracegen); select them with AIUR_GPU_TRACE=compiled.
compiled-trace = ["cuda", "ixvm-tracegen/kernel"]
function-profile = ["aiur/function-profile"]
function-profile-ops = ["function-profile", "aiur/function-profile-ops"]

[[example]]
name = "ixvm_bench"
required-features = ["stark"]

[[example]]
name = "witness"
required-features = ["stark"]

[[bin]]
name = "ixvm-proof"
path = "src/proof.rs"
required-features = ["stark"]

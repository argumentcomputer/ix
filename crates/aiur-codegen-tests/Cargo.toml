[package]
name = "aiur-codegen-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Checks native executors generated by aiur-codegen against the interpreter"
publish = false

# The build script generates the coverage fixture's executor into OUT_DIR,
# so the tests compile exactly what the emitter produces today.

[build-dependencies]
aiur = { path = "../aiur", features = ["native"] }
aiur-codegen = { path = "../aiur-codegen" }

[dev-dependencies]
aiur = { path = "../aiur", features = ["native"] }
aiur-codegen = { path = "../aiur-codegen" }
multi-stark = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

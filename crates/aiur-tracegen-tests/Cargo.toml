[package]
name = "aiur-tracegen-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Checks CUDA row writers generated by aiur-tracegen against host population"
publish = false

# With feature `cuda`, the build script generates and compiles the depth and
# grouping fixtures' trace bundles into OUT_DIR, so the tests run exactly
# what the emitter produces today. Without it the crate is empty.

[features]
cuda = ["aiur/cuda", "multi-stark/cuda", "dep:aiur-tracegen"]

[dependencies]
aiur = { path = "../aiur" }
multi-stark = { workspace = true }

[build-dependencies]
aiur = { path = "../aiur" }
aiur-tracegen = { path = "../aiur-tracegen", optional = true }

[dev-dependencies]
aiur = { path = "../aiur", features = ["parallel"] }

[lints]
workspace = true

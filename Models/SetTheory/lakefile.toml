name = "ix-set-theory-model"
defaultTargets = ["IxSetTheoryModel"]

# Keep Mathlib confined to this package. Its release matches Ix's toolchain.
# Resolve shared dependencies from Mathlib's pinned manifest first.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

[[require]]
name = "ix-kernel"
path = "../../IxKernel"

[[lean_lib]]
name = "IxSetTheoryModel"

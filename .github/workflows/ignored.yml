name: Extended CI tests

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: push-to-main and manual dispatch only — every merged
# commit runs the extended tests; a later merge must never cancel an in-flight
# run.

jobs:
  ignored-test:
    runs-on: warp-ubuntu-latest-x64-32x
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
      # Only restore the cache, since `ci.yml` will save the test binary to the cache first
      - uses: actions/cache/restore@v6
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          # `test-args` is currently broken, so we run `lake test` separately
          # Restore once https://github.com/leanprover/lean-action/pull/153 is merged
          # test: true
          # test-args: "-- --ignored"
          use-github-cache: false
      - run: >-
          lake test -- --ignored
          --exclude=tc-pins,tc-accel-diff,tc-anon-diff,tc-init,tc-tutorial,tc-roundtrip,lean4lean
      - run: lake exe Apps.ZKVoting.Prover

  valgrind-ffi:
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
      # Only restore the cache, since `ci.yml` will save the test binary to the cache first
      - uses: actions/cache/restore@v6
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "IxTests"
          use-github-cache: false
      - name: Install valgrind
        run: |
          # Some warpbuild images ship a mirrorlist with an unreachable
          # azure.archive.ubuntu.com entry, causing apt-get update to stall indefinitely.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Run tests under valgrind
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=.github/valgrind.supp \
            .lake/build/bin/IxTests ffi

  # Ix.Tc formal verification + typechecker parity suite, run on push-to-main
  # and manual dispatch only so its ~13-min `Ix.Tc.Verify` proof elaboration and
  # parity run don't gate PRs. Restores the base `.lake` that ci.yml's build job
  # saved (via the `lake-…` fallback) and keeps its own `lake-tc-…` cache so the
  # proof elaboration persists across main commits; lean-action provides only the
  # toolchain, and the steps build/test against the restored `.lake`.
  tc-test:
    name: Ix.Tc verification and parity
    runs-on: warp-ubuntu-latest-x64-16x
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
      - uses: actions/cache@v6
        with:
          path: ./.lake
          key: lake-tc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-tc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Check Ix.Tc exported theorem trust manifest
        run: lake build Ix.Tc.Verify.Audit.Completed Ix.Tc.Verify.Audit.Statements
      - name: Build Ix.Tc formal verification
        run: lake build IxTcVerify
      - name: Check Ix.Tc verification sorry frontier
        run: lake build Ix.Tc.Verify.Audit.SorryFrontier
      - name: Test Ix.Tc unit and adversarial fixtures
        run: lake test --wfail -- tc-unit
      # These ignored typechecker suites run only here; the ignored-test job
      # --excludes them so nothing is duplicated. tc-pins / tc-accel-diff
      # compile their `.ixe` env on demand (see Tests.Tc.ParityEnv).
      - name: Test Ix.Tc ignored suites
        run: >-
          lake test --wfail -- --ignored
          tc-pins tc-accel-diff tc-anon-diff tc-init tc-tutorial tc-roundtrip lean4lean

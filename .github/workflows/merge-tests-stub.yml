name: Merge tests

# Temporary transition stub: all former merge-queue suites (`ci:compiler-closures`,
# `ci:binding-proof`, `ci:misc`, `ci:landing-initstd-cli`, `certified-kernel`, and
# `valgrind-ffi`) now run directly in `.github/workflows/ci.yml` as parallel,
# path-gated PR checks. Keep this stub until the `main` branch ruleset drops the
# `merge-gate / pass` requirement and disables the merge queue, then delete it.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  merge-gate:
    name: merge-gate / pass
    runs-on: ubuntu-latest
    steps:
      - name: Satisfy legacy merge-gate check during transition
        run: echo "All former merge-tests checks now run directly in CI Jobs (ci.yml)."

# CodeQL, advanced setup (replaces the default setup configured in the repo
# settings — that must be DISABLED there, or these SARIF uploads are
# rejected). Coverage stays main pushes + PRs, in two jobs rather than a
# language matrix so each analysis runs only when its inputs changed:
# the rust analysis re-extracts and type-checks the whole cargo
# workspace — minutes of compute most pushes in this Lean-dominant repo
# don't need — and the actions analysis scans the workflow/action YAML.
# The gates are job-level `if`s rather than workflow-level `on.paths`
# (or a dynamically-built matrix) deliberately: a required check that
# never triggers sticks at "Expected", while a skipped job satisfies it.
# Rust analysis runs only when Rust inputs change, with dependency extraction
# cached between runs.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      # paths-filter diffs the PR via the API on pull_request events, but
      # needs a checkout to resolve the pushed commit range on push events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/codeql.yml'
            actions:
              - '.github/**'

  analyze-actions:
    name: Analyze (actions)
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: runs-on=${{ github.run_id }}-analyze-rust-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          dependency-caching: true
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust"

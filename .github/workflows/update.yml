name: Update Lean toolchain and pinned deps

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}

      # `dev` carries pinned-tag updates and lean4-nix gating; `main` only
      # mirrors upstream and ignores these inputs. A PR is opened
      # on an update/lean-{release} branch whether or not the build passes, so
      # an incompatible release shows up as a failing PR to review. Dependencies
      # pinned to a Lean version tag move with the toolchain; a dependency
      # pinned to a commit hash is reported and left alone.
      - uses: argumentcomputer/lean-update@dev
        with:
          # The root package plus every package under Benchmarks/ — `/**`
          # walks the whole tree (catching Catalog's nested fixture
          # workspaces) and skips dotted directories, so `.lake`
          # dependency checkouts are never swept up — and the certified
          # kernel's package and its model, whose Mathlib `rev` is a Lean
          # version tag and moves with the toolchain. The pin tables and
          # frozen audit counts are not regenerated here: see "On a
          # toolchain bump" in docs/kernel.md.
          lake_package_directory: ". Benchmarks/** IxC Models/SetTheory"
          bump_mode: pinned-tags
          pr: true
          update_lean4_nix: true

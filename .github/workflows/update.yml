name: Update Lean toolchain and pinned deps

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Mint a token from the GitHub App so the opened PR triggers CI; pushes
      # made with GITHUB_TOKEN do not. Same App as the org repo-sync workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}

      # `dev` carries the fork's bump_mode/release_channel support; `main` only
      # mirrors upstream, which silently ignores these inputs. A PR is opened
      # on an update/lean-{release} branch whether or not the build passes, so
      # an incompatible release shows up as a failing PR to review. Dependencies
      # pinned to a Lean version tag move with the toolchain; a dependency
      # pinned to a commit hash is reported and left alone.
      - uses: argumentcomputer/lean-update@dev
        with:
          # The root package plus the benchmark packages. `/**` walks a whole
          # subtree, reaching packages nested inside another package (Catalog's
          # relocation fixtures, Compile's TruthMines) and skipping dotted
          # directories so `.lake` dependency checkouts are never swept up; it
          # matches descendants only, hence Benchmarks/Compile alongside it.
          #
          # The list is spelled out rather than globbed as Benchmarks/** because
          # the action has no exclusion syntax and Benchmarks/CompileFC must
          # stay pinned: it builds against formal-conjectures at a commit hash,
          # which the action leaves alone, so moving its toolchain off v4.27.0
          # only breaks the build. A new benchmark package has to be added here.
          lake_package_directory: >-
            .
            Benchmarks/Catalog/**
            Benchmarks/Compile
            Benchmarks/Compile/**
            Benchmarks/TruthMines
          bump_mode: pinned-tags
          pr: true
          token: ${{ steps.app-token.outputs.token }}

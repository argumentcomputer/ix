name: CI Jobs

on:
  pull_request:
  merge_group:
  # Pushes to main run the same jobs so their sticky disks get a `main`
  # snapshot: RunsOn files each run's snapshot under its own ref, and a ref
  # with none falls back to the default branch's. Without this run every
  # new PR branch and every merge-queue entry starts from an empty disk.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each job has its own sticky cache, so the checks run independently. Lean
  # builds, tests, and lints share one job and one incremental build cache.
  lean-test:
    runs-on: runs-on=${{ github.run_id }}-lean-test-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-lean-test-x86-64-v4:50gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sccache keys rustc outputs by content, so the workspace crates, which
      # cargo rebuilds after every fresh checkout because their mtimes moved,
      # come back as cache hits. RunsOn configures it before anything can
      # start an sccache server.
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      # lean-action runs `lake build`, then `lake test`, then `lake lint`.
      # The build-all lint driver compiles every lib/exe target with --wfail,
      # so a warning in any target (exes, benchmarks, Apps) — not just the
      # default lib — fails CI. A push to main already passed the tests in
      # the merge queue; that run only exists to snapshot the build
      # products, so the tests are skipped there.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: "--wfail -v"
          test: ${{ github.event_name != 'push' }}
          test-args: "--wfail"
          lint-args: "-- --wfail -v"
          use-github-cache: false
      - name: Check codegen'd IxVM kernel is up to date
        if: github.event_name != 'push'
        run: lake exe ix codegen --check
      # A stale generated trace module is otherwise caught only when the
      # generated GPU provider registers at proving time.
      - name: Check generated trace writers, CUDA units and manifest are up to date
        if: github.event_name != 'push'
        run: lake exe ix codegen --trace-bundle --check
      - name: Check Lean versions match for Ix, compiler bench, certified kernel, its models, and certified compiler with its benchmark runner
        if: github.event_name != 'push'
        run: |
          diff lean-toolchain Benchmarks/Compile/lean-toolchain
          diff lean-toolchain IxCK/lean-toolchain
          diff lean-toolchain Models/SetTheory/lean-toolchain
          diff lean-toolchain Models/KernelBridge/lean-toolchain
          diff lean-toolchain IxCC/lean-toolchain
          diff lean-toolchain IxCC/benchmarks/runner/lean-toolchain
      - name: Test Ix CLI
        if: github.event_name != 'push'
        run: lake test --wfail -- --tier ci:cli
      - name: Test Ixon v4 contracts and consumers
        if: github.event_name != 'push'
        run: |
          lake exe ixon-v4-primitives
          lake exe ixon-v4-tests --primitives

  rust-test:
    runs-on: runs-on=${{ github.run_id }}-rust-test-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-rust-test-x86-64-v4:50gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sccache keys rustc outputs by content, so the workspace crates, which
      # cargo rebuilds after every fresh checkout because their mtimes moved,
      # come back as cache hits. RunsOn configures it before anything can
      # start an sccache server.
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      # Install Lean for rust-bindgen step
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
      # A push to main already passed the lints and tests in the merge
      # queue; that run only builds, so the sticky disk holds the check,
      # clippy and test-binary artifacts the next PR run will fingerprint.
      - name: Check Rustfmt code style
        if: github.event_name != 'push'
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
      - name: Check clippy warnings
        run: cargo clippy --release --workspace --all-targets --features ix-ffi/parallel,ix-ffi/net,ix-ffi/test-ffi -- -D warnings
      - name: Check *everything* compiles
        run: cargo check --release --workspace --all-targets --features ix-ffi/parallel,ix-ffi/net,ix-ffi/test-ffi
      - name: Tests
        run: cargo nextest run --release --profile ci --workspace ${{ github.event_name == 'push' && '--no-run' || '' }}
      - name: Get Rust version
        if: github.event_name != 'push'
        run: |
          echo "RUST_VERSION=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)" | tee -a "$GITHUB_ENV"
      # A Docker action: the job's RUSTC_WRAPPER reaches its container, where
      # sccache is not installed, and cargo fails before deny runs. Deny only
      # reads metadata, and cargo treats an empty wrapper as none.
      - name: Cargo-deny
        if: github.event_name != 'push'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          RUSTC_WRAPPER: ""
        with:
          rust-version: ${{ env.RUST_VERSION }}

  # Compile and link the opt-in backend without requiring a GPU. Runtime and
  # proof-byte equivalence are covered by multi-stark's NVIDIA smoke suite.
  cuda-compile:
    runs-on: runs-on=${{ github.run_id }}-cuda-compile-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    env:
      # This job validates feature plumbing and the Rust-staticlib-to-Lean
      # link without paying for a GPU runner. One explicit architecture
      # is sufficient for this downstream integration gate.
      MULTI_STARK_CUDA_ARCHS: "80"
    steps:
      # No sccache here yet. Once the GPU benchmark lands after #644, wire
      # it for both compilers: `sccache: s3` plus the sccache action for
      # rustc (this job runs in a container, so its S3 credentials via the
      # instance role need checking first), and an `NVCC` wrapper running
      # `sccache nvcc` for the kernels, which multi-stark's build script
      # must compile with `-c` per source for sccache to cache them.
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain bootstrap dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git libclang-dev sudo
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          cache-key: cuda-13.3.1-ubuntu26
      # S3 caching keeps the container independent of host bind mounts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-cuda-13.3.1-ubuntu26-x86-64-v4-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lake-cuda-13.3.1-ubuntu26-x86-64-v4-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
      - name: Compile CUDA Rust targets
        run: |
          cargo check --release --locked --workspace --all-targets --features ix-ffi/parallel,ix-ffi/cuda,ix-proof-compression/cuda
      - name: Link CUDA-enabled Lean executables
        run: IX_CUDA=1 lake build ix bench-typecheck

  lints:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck over composite action scripts, pinact (actions
      # must be SHA-pinned with a matching version comment) and zizmor
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@main

  # Whether a change reaches the certified compiler's checks (IxCC/docs/ci.md):
  # IxCC/ itself, the IxCK codec it imports, the flake, the toolchain, and the
  # workflow and local actions its trust ledger audits. And whether it reaches
  # the kernel-bridge model (Models/KernelBridge/README.md): IxCC's Lean
  # sources and Lake files, all of IxCK, the model itself, the root toolchain
  # and lakefile (its gate script) and this workflow. Job-level gates, as in
  # codeql.yml. A merge group skips the filter: merge-tests.yml runs IxCC's
  # checks and the model's gate on every merge group.
  changes:
    name: Detect IxCC changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ixcc: ${{ steps.filter.outputs.ixcc }}
      kernel-bridge: ${{ steps.filter.outputs.kernel-bridge }}
    steps:
      # paths-filter diffs the PR via the API on pull_request events, but
      # needs a checkout to resolve the pushed commit range on push events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            ixcc:
              - 'IxCC/**'
              - 'IxCK/Ixon/**'
              - 'IxCK/Address/**'
              - 'IxCK/lakefile.lean'
              - 'IxCK/lake-manifest.json'
              - 'IxCK/lean-toolchain'
              - 'flake.nix'
              - 'flake.lock'
              - 'lean-toolchain'
              - '.github/workflows/ixcc.yml'
              - '.github/actions/**'
            kernel-bridge:
              - 'IxCC/IxCC/**'
              - 'IxCC/IxCC.lean'
              - 'IxCC/lakefile.lean'
              - 'IxCC/lake-manifest.json'
              - 'IxCC/lean-toolchain'
              - 'IxCK/**'
              - 'Models/KernelBridge/**'
              - 'lean-toolchain'
              - 'lakefile.lean'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  ixcc:
    name: IxCC
    needs: changes
    if: needs.changes.outputs.ixcc == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/ixcc.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # One result for ci-gate, which requires every job it needs to succeed:
  # IxCC's checks passed, or the change does not reach them.
  ixcc-result:
    name: IxCC result
    if: ${{ always() }}
    needs: [changes, ixcc]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require IxCC's checks when the change reaches them
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REACHES_IXCC: ${{ needs.changes.outputs.ixcc }}
          IXCC_RESULT: ${{ needs.ixcc.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::The IxCC path filter did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$REACHES_IXCC" = true ]; then
            if [ "$IXCC_RESULT" != success ]; then
              echo "::error::IxCC's checks did not succeed: $IXCC_RESULT"
              exit 1
            fi
            echo "IxCC's checks passed."
          else
            echo "The change does not reach IxCC, or this is a merge group (merge-tests.yml runs IxCC's checks there)."
          fi

  # The kernel-bridge model's gate (`lake run check-kernel-bridge`: its build,
  # whose modules treat warnings as errors, and its axiom-fence inventory) when
  # a change reaches it; merge-tests.yml's kernel partition runs it on every
  # merge group. The model requires IxCK and IxCC by path and builds IxCK's
  # kernel and model tier, the IxCC modules it imports and Blake3 (with Cargo).
  # It uses lean-test's sticky lineage, which holds IxCK's objects in
  # `.lake/kernel`, and adds IxCC's and the model's Lake directories to it, as
  # merge-tests.yml adds the set-theory model's.
  kernel-bridge:
    name: Kernel bridge model
    needs: changes
    if: needs.changes.outputs.kernel-bridge == 'true'
    permissions:
      contents: read
    runs-on: runs-on=${{ github.run_id }}-kernel-bridge-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-lean-test-x86-64-v4:50gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=target,path=IxCC/.lake,path=Models/KernelBridge/.lake
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
      - name: Check the kernel-bridge model and its fence inventory
        run: lake run check-kernel-bridge

  # One result for ci-gate: the model's gate passed, or the change does not
  # reach it.
  kernel-bridge-result:
    name: Kernel bridge result
    if: ${{ always() }}
    needs: [changes, kernel-bridge]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the kernel-bridge gate when the change reaches it
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REACHES_BRIDGE: ${{ needs.changes.outputs.kernel-bridge }}
          BRIDGE_RESULT: ${{ needs.kernel-bridge.result }}
        run: |
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::The path filter did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$REACHES_BRIDGE" = true ]; then
            if [ "$BRIDGE_RESULT" != success ]; then
              echo "::error::The kernel-bridge gate did not succeed: $BRIDGE_RESULT"
              exit 1
            fi
            echo "The kernel-bridge gate passed."
          else
            echo "The change does not reach the kernel-bridge model, or this is a merge group (merge-tests.yml runs its gate there)."
          fi

  ci-gate:
    if: ${{ always() }}
    needs: [lean-test, rust-test, cuda-compile, lints, ixcc-result, kernel-bridge-result]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}

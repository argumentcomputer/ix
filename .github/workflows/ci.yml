name: CI Jobs

on:
  pull_request:
    # Include `edited` so retargeting a PR's base branch always re-evaluates
    # `dorny/paths-filter` against the new base..head diff. Non-base edits are
    # intentionally not short-circuited to `skipped`, because GitHub treats a
    # skipped required check (`ci-gate`) as passing over a prior failure.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Pushes to main run build-only cache-warming steps so each sticky-disk
  # lineage keeps a fresh `main` snapshot (new PR branches fall back to
  # `main`'s snapshot) and the S3 `.ixa` artifact cache stays warm.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Compute changed subsystems once so downstream jobs skip runner spin-up when
  # untouched, and emit the exact `run_*` booleans consumed by both job `if:`
  # gates and `check-results` (keeping `runs-on/spot-retry-gate` sound even
  # when jobs are legitimately skipped).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_push: ${{ steps.plan.outputs.is_push }}
      is_draft: ${{ steps.plan.outputs.is_draft }}
      run_quick: ${{ steps.plan.outputs.run_quick }}
      run_lints: ${{ steps.plan.outputs.run_lints }}
      run_rust: ${{ steps.plan.outputs.run_rust }}
      run_cuda: ${{ steps.plan.outputs.run_cuda }}
      run_gnark: ${{ steps.plan.outputs.run_gnark }}
      run_contracts: ${{ steps.plan.outputs.run_contracts }}
      run_host_build: ${{ steps.plan.outputs.run_host_build }}
      run_host_fast: ${{ steps.plan.outputs.run_host_fast }}
      run_host_heavy: ${{ steps.plan.outputs.run_host_heavy }}
      run_kernel: ${{ steps.plan.outputs.run_kernel }}
      run_valgrind: ${{ steps.plan.outputs.run_valgrind }}
      run_formal_build: ${{ steps.plan.outputs.run_formal_build }}
      run_formal_tests: ${{ steps.plan.outputs.run_formal_tests }}
      run_refinement: ${{ steps.plan.outputs.run_refinement }}
      ixa_key: ${{ steps.plan.outputs.ixa_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            global:
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'lakefile.lean'
              - 'rust-toolchain.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            rust:
              - 'crates/**'
              - '**/*.rs'
              - 'c/**'
              - 'Aiur/c/**'
              - 'deny.toml'
              - '.config/nextest.toml'
              - 'rustfmt.toml'
              - '.github/valgrind.supp'
              - 'Tests/Fixtures/**'
              - 'tools/gnark/**'
            gnark:
              - 'tools/gnark/**'
              - 'crates/proof-compression/src/pipeline/wrap/outer/**'
              - 'crates/proof-compression/verifying-keys/**'
            contracts:
              - 'contracts/**'
              - 'crates/proof-compression/verifying-keys/**'
            cuda:
              - 'crates/aggregate-controller/**'
              - 'crates/aiur/**'
              - 'crates/aiur-codegen/**'
              - 'crates/aiur-codegen-tests/**'
              - 'crates/aiur-tracegen/**'
              - 'crates/aiur-tracegen-tests/**'
              - 'crates/formal-generated/**'
              - 'crates/ixvm/**'
              - 'crates/ixvm-native/**'
              - 'crates/ffi/**'
              - 'crates/proof-compression/**'
              - 'crates/stark-verifier/**'
              - 'crates/stark-verifier-native/**'
              - 'crates/ix-prover/**'
              - 'crates/common/**'
              - 'crates/ixon/**'
              - 'crates/record-pool/**'
              - 'crates/stark-key/**'
            host:
              - 'FormalAiurKeys.lean'
              - 'FormalCodegen.lean'
              - 'Ix.lean'
              - 'Ix/**'
              - 'IxC/**'
              - 'IxSharingVerify.lean'
              - 'IxSharingVerify/**'
              - 'Main.lean'
              - 'Tests.lean'
              - 'Tests/**'
              - 'Apps.lean'
              - 'Apps/**'
              - 'Benchmarks/**'
              - 'c/**'
              - 'Aiur/Aiur/Ixon.lean'
              - 'Aiur/Aiur/Ixon/**'
              - 'IxVM/IxVM/Fixture.lean'
              - 'Scripts/SourceHygiene.lean'
              - 'Scripts/CheckCiFilters.lean'
              - 'Scripts/FriSecurity.lean'
              - 'tools/formal-aiur.keys'
            kernel:
              - 'IxC/**'
              - 'Models/SetTheory/**'
              - 'Ix/Address/**'
              - 'Ix/Address.lean'
              - 'Ix/Aiur/**'
              - 'Ix/AssumptionTree.lean'
              - 'Ix/CanonM.lean'
              - 'Ix/Cert/**'
              - 'Ix/Claim*.lean'
              - 'Ix/Cli/Common.lean'
              - 'Ix/Common.lean'
              - 'Ix/Compile/**'
              - 'Ix/CompileCert/**'
              - 'Ix/CompileCertified.lean'
              - 'Ix/CompileDriver.lean'
              - 'Ix/CompileM.lean'
              - 'Ix/CondenseM.lean'
              - 'Ix/Environment.lean'
              - 'Ix/EnvScope.lean'
              - 'Ix/GraphM.lean'
              - 'Ix/Ground.lean'
              - 'Ix/HostAdmission.lean'
              - 'Ix/HostAdmission/**'
              - 'Ix/IndFlags.lean'
              - 'Ix/Ixon/**'
              - 'Ix/Ixon.lean'
              - 'Ix/IxonContract.lean'
              - 'Ix/IxonUniv.lean'
              - 'Ix/KernelCheck/**'
              - 'Ix/KernelDisplay/**'
              - 'Ix/LeanExport.lean'
              - 'Ix/LeanIngress/**'
              - 'Ix/LeanIngress.lean'
              - 'Ix/Merkle.lean'
              - 'Ix/Meta.lean'
              - 'Ix/Mutual.lean'
              - 'Ix/RoleBinding/**'
              - 'Ix/RoleEvidence.lean'
              - 'Ix/SOrder.lean'
              - 'Ix/SemanticContract.lean'
              - 'Ix/Sharing/**'
              - 'Ix/SpecDigest/**'
              - 'Ix/SpecDigest.lean'
              - 'Ix/Store.lean'
              - 'Ix/Typing.lean'
              - 'Ix/IxVM/Consistency/**'
              - 'Ix/IxVM/ConsistencyAudit.lean'
              - 'Ix/IxVM/ConsistencyModelAudit.lean'
              - 'Ix/IxVM/PwHints.lean'
              - 'Ix/IxVM/RecordSections.lean'
              - 'Ix/IxVM/Refinement/Claim.lean'
              - 'IxSharingVerify.lean'
              - 'IxSharingVerify/**'
              - 'Benchmarks/Kernel/**'
              - 'Tests/Ix/Kernel/**'
              - 'Tests/Ix/Cert/**'
              - 'Tests/Fixtures/trust-surface/**'
              - 'Tests/Fixtures/compile-correct-closure-manifest.txt'
              - 'Tests/Fixtures/check-bytes-closure-manifest.txt'
            refinement:
              - 'Aiur/**'
              - 'IxVM/**'
              - 'MultiStark/**'
              - 'IxVMRefinement/**'
              - 'IxC/**'
              - 'Ix/Aggr/**'
              - 'Ix/Aiur/**'
              - 'Ix/MultiStark/**'
              - 'Ix/IxVM/Consistency/**'
              - 'Ix/IxVM/ConsistencyAudit.lean'
              - 'Ix/IxVM/ConsistencyModelAudit.lean'
              - 'Ix/IxVM/Refinement/**'
              - 'Ix/SpecDigest/**'
              - 'Ix/SpecDigest.lean'
              - 'Ix/CanonM.lean'
              - 'Ix/Cert/**'
              - 'Ix/Common.lean'
              - 'Ix/Compile/**'
              - 'Ix/CompileCert/**'
              - 'Ix/CompileDriver.lean'
              - 'Ix/CompileM.lean'
              - 'Ix/CondenseM.lean'
              - 'Ix/Environment.lean'
              - 'Ix/GraphM.lean'
              - 'Ix/Ground.lean'
              - 'Ix/IndFlags.lean'
              - 'Ix/Ixon/**'
              - 'Ix/Ixon.lean'
              - 'Ix/IxonContract.lean'
              - 'Ix/IxonUniv.lean'
              - 'Ix/LeanIngress/**'
              - 'Ix/LeanIngress.lean'
              - 'Ix/Merkle.lean'
              - 'Ix/Mutual.lean'
              - 'Ix/RoleBinding/**'
              - 'Ix/RoleEvidence.lean'
              - 'Ix/SOrder.lean'
              - 'Ix/SemanticContract.lean'
              - 'Ix/DynamicLink/**'
              - 'Ix/HostAdmission.lean'
              - 'Ix/HostAdmission/**'
              - 'Ix/Sharing/**'
              - 'Ix/Store.lean'
              - 'Ix/Claim*.lean'
              - 'Ix/AssumptionTree.lean'
              - 'Ix/Address/**'
              - 'Ix/Address.lean'
              - 'IxSharingVerify.lean'
              - 'IxSharingVerify/**'
              - 'Tests/Ix/Kernel/ModelLaws.lean'
              - 'Tests/Fixtures/circuit-composed-closure-manifest.txt'
            formal:
              - 'Aiur/**'
              - 'IxVM/**'
              - 'MultiStark/**'
              - 'IxVMRefinement/**'
              - 'IxC/**'
              - 'FormalAiurKeys.lean'
              - 'FormalCodegen.lean'
              - 'Ix/Address/**'
              - 'Ix/Address.lean'
              - 'Ix/CanonM.lean'
              - 'Ix/Cert/**'
              - 'Ix/Check.lean'
              - 'Ix/Common.lean'
              - 'Ix/FormalCompiler.lean'
              - 'Ix/FormalCompiler/**'
              - 'Ix/FormalProver.lean'
              - 'Ix/IxVM/**'
              - 'Ix/Compile/**'
              - 'Ix/CompileCert/**'
              - 'Ix/CompileM.lean'
              - 'Ix/CompileCertified.lean'
              - 'Ix/CompileDriver.lean'
              - 'Ix/CondenseM.lean'
              - 'Ix/Environment.lean'
              - 'Ix/GraphM.lean'
              - 'Ix/Ground.lean'
              - 'Ix/IndFlags.lean'
              - 'Ix/Ixon/**'
              - 'Ix/Ixon.lean'
              - 'Ix/IxonContract.lean'
              - 'Ix/IxonUniv.lean'
              - 'Ix/LeanIngress/**'
              - 'Ix/LeanIngress.lean'
              - 'Ix/Merkle.lean'
              - 'Ix/Meta.lean'
              - 'Ix/Mutual.lean'
              - 'Ix/Claim*.lean'
              - 'Ix/AssumptionTree.lean'
              - 'Ix/Aggr/**'
              - 'Ix/Aiur/**'
              - 'Ix/DynamicLink/**'
              - 'Ix/MultiStark/**'
              - 'Ix/Shard/**'
              - 'Ix/Sharing/**'
              - 'Ix/RoleBinding/**'
              - 'Ix/RoleEvidence.lean'
              - 'Ix/SOrder.lean'
              - 'Ix/SemanticContract.lean'
              - 'Ix/HostAdmission.lean'
              - 'Ix/HostAdmission/**'
              - 'Ix/SpecDigest/**'
              - 'Ix/SpecDigest.lean'
              - 'Ix/Store.lean'
              - 'Ix/Aiur*.lean'
              - 'Ix/Cli/Aiur*.lean'
              - 'Ix/Cli/CatalogAggregate.lean'
              - 'Ix/Cli/CheckCmd.lean'
              - 'Ix/Cli/Formal*.lean'
              - 'Ix/Cli/Prove*.lean'
              - 'Ix/Cli/Verify*.lean'
              - 'Ix/Cli/Aggr*.lean'
              - 'Ix/Cli/ClaimPolicy.lean'
              - 'Ix/Cli/CodegenCmd.lean'
              - 'Scripts/CheckFormal.lean'
              - 'Tests/Formal*.lean'
              - 'Tests/FormalChecks/**'
              - 'Tests/VerifyPath.lean'
              - 'Tests/Fixtures/MultiStark/**'
              - 'Tests/IxVMMain.lean'
              - 'Tests/Ix/IxVM/**'
              - 'Tests/Ix/MultiStarkVerifier.lean'
              - 'Tests/Ix/Kernel/Arena.lean'
              - 'Tests/Ix/Kernel/ModelLaws.lean'
              - 'Tests/Ix/InstanceSymbols.lean'
              - 'Tests/Ix/VMSource.lean'
              - 'Tests/Ix/IOIngress.lean'
              - 'Tests/AggrBindingReuse.lean'
              - 'tools/formal-aiur.keys'
              - 'tools/check-formal-keys.sh'
              - 'tools/check-aiur-compression-fixtures.sh'
              - 'crates/**'
      - name: Resolve job plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          F_GLOBAL: ${{ steps.filter.outputs.global }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_CUDA: ${{ steps.filter.outputs.cuda }}
          F_GNARK: ${{ steps.filter.outputs.gnark }}
          F_CONTRACTS: ${{ steps.filter.outputs.contracts }}
          F_HOST: ${{ steps.filter.outputs.host }}
          F_KERNEL: ${{ steps.filter.outputs.kernel }}
          F_REFINEMENT: ${{ steps.filter.outputs.refinement }}
          F_FORMAL: ${{ steps.filter.outputs.formal }}
        run: |
          is_push=false
          is_draft=false
          if [ "$EVENT_NAME" = "push" ]; then
            is_push=true
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ]; then
            is_draft=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            rust=true; cuda=true; gnark=true; contracts=true; host=true; kernel=true; refinement=true; formal=true
          else
            rust=false; cuda=false; gnark=false; contracts=false; host=false; kernel=false; refinement=false; formal=false
            [ "$F_GLOBAL" = "true" ] || [ "$F_RUST" = "true" ] && rust=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_CUDA" = "true" ] && cuda=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_GNARK" = "true" ] && gnark=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_CONTRACTS" = "true" ] && contracts=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_HOST" = "true" ] || [ "$F_RUST" = "true" ] && host=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_KERNEL" = "true" ] && kernel=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_REFINEMENT" = "true" ] && refinement=true
            [ "$F_GLOBAL" = "true" ] || [ "$F_FORMAL" = "true" ] || [ "$F_REFINEMENT" = "true" ] && formal=true
          fi

          run_quick=false
          run_lints=false
          run_rust=false
          run_cuda=false
          run_gnark=false
          run_contracts=false
          run_host_build=false
          run_host_fast=false
          run_host_heavy=false
          run_kernel=false
          run_valgrind=false
          run_formal_build=false
          run_formal_tests=false
          run_refinement=false

          if [ "$is_push" = "true" ]; then
            # Push to main only warms build/artifact caches; tests already ran on the PR.
            [ "$rust" = "true" ] && run_rust=true
            [ "$cuda" = "true" ] && run_cuda=true
            if [ "$host" = "true" ] || { [ "$is_draft" = "false" ] && [ "$formal" = "true" ]; }; then
              run_host_build=true
            fi
            [ "$kernel" = "true" ] && run_kernel=true
            [ "$formal" = "true" ] && run_formal_build=true
            [ "$refinement" = "true" ] && run_refinement=true
          else
            run_quick=true
            run_lints=true
            [ "$rust" = "true" ] && run_rust=true
            [ "$cuda" = "true" ] && run_cuda=true
            [ "$gnark" = "true" ] && run_gnark=true
            [ "$contracts" = "true" ] && run_contracts=true
            if [ "$host" = "true" ] || { [ "$is_draft" = "false" ] && [ "$formal" = "true" ]; }; then
              run_host_build=true
            fi
            [ "$host" = "true" ] && run_host_fast=true
            if [ "$is_draft" = "false" ]; then
              [ "$host" = "true" ] && run_host_heavy=true
              [ "$kernel" = "true" ] && run_kernel=true
              [ "$rust" = "true" ] && run_valgrind=true
              [ "$formal" = "true" ] && run_formal_build=true
              [ "$formal" = "true" ] && run_formal_tests=true
              [ "$refinement" = "true" ] && run_refinement=true
            fi
          fi

          # Deterministic content-addressed key for `.ixa` exports from git
          # trees alone (immune to sticky-disk `.lake/` or `target/` files).
          ixa_hash=$(git rev-parse \
            HEAD:lean-toolchain HEAD:lake-manifest.json \
            HEAD:Aiur HEAD:IxVM HEAD:MultiStark | sha256sum | cut -d' ' -f1)
          {
            echo "is_push=$is_push"
            echo "is_draft=$is_draft"
            echo "run_quick=$run_quick"
            echo "run_lints=$run_lints"
            echo "run_rust=$run_rust"
            echo "run_cuda=$run_cuda"
            echo "run_gnark=$run_gnark"
            echo "run_contracts=$run_contracts"
            echo "run_host_build=$run_host_build"
            echo "run_host_fast=$run_host_fast"
            echo "run_host_heavy=$run_host_heavy"
            echo "run_kernel=$run_kernel"
            echo "run_valgrind=$run_valgrind"
            echo "run_formal_build=$run_formal_build"
            echo "run_formal_tests=$run_formal_tests"
            echo "run_refinement=$run_refinement"
            echo "ixa_key=ixa-v2-${ixa_hash}"
          } >> "$GITHUB_OUTPUT"

  lints:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.run_lints == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck over composite action scripts, pinact (actions
      # must be SHA-pinned with a matching version comment) and zizmor.
      # Pinned commit from `argumentcomputer/ci-workflows@main` (no release tag).
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@2a6b43be08a6dab790e870c1717b79be2d6e70bc

  quick-checks:
    name: Toolchain sync
    needs: changes
    if: needs.changes.outputs.run_quick == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Lean versions match across all workspaces
        run: |
          checked=0
          while IFS= read -r tc; do
            diff -u lean-toolchain "$tc"
            checked=$((checked + 1))
          done < <(find . -name lean-toolchain -not -path './.lake/*' -not -path '*/.lake/*' -not -path './target/*' | sort)
          test "$checked" -ge 10

  rust-test:
    name: Rust lint & tests
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: runs-on=${{ github.run_id }}-rust-test-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-rust-test-x86-64-v4:50gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      # Install Lean headers for lean-ffi bindgen (no Mathlib cache needed).
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Check Rustfmt code style
        if: needs.changes.outputs.is_push != 'true'
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
      # Clippy runs full rustc checking across every target and feature set,
      # superseding a separate `cargo check`.
      - name: Check clippy warnings
        run: cargo clippy --release --workspace --all-targets --features ix-ffi/parallel,ix-ffi/net,ix-ffi/test-ffi,aiur/parallel,ixvm/parallel -- -D warnings
      - name: Tests
        env:
          IS_PUSH: ${{ needs.changes.outputs.is_push }}
          # Dedicated ci-rust-test sticky disk: skip thin-LTO linking on test
          # binaries and omit ix-ffi/net (already checked by clippy above).
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          extra=""
          if [ "$IS_PUSH" = "true" ]; then
            extra="--no-run"
          fi
          # shellcheck disable=SC2086
          cargo nextest run --release --profile ci --workspace \
            --features ix-ffi/parallel,ix-ffi/test-ffi,aiur/parallel,ixvm/parallel $extra
      - name: Get Rust version
        if: needs.changes.outputs.is_push != 'true'
        run: |
          echo "RUST_VERSION=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)" | tee -a "$GITHUB_ENV"
      - name: Cargo-deny
        if: needs.changes.outputs.is_push != 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        env:
          RUSTC_WRAPPER: ""
        with:
          rust-version: ${{ env.RUST_VERSION }}

  # Compile and link the opt-in CUDA backend without requiring a GPU.
  cuda-compile:
    name: CUDA compile & link
    needs: changes
    if: needs.changes.outputs.run_cuda == 'true'
    runs-on: runs-on=${{ github.run_id }}-cuda-compile-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    env:
      MULTI_STARK_CUDA_ARCHS: "80"
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain bootstrap dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git libclang-dev sudo
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          cache-key: cuda-13.3.1-ubuntu26
      # Restore `.lake` on PRs without paying the ~5m cache-save tax on every
      # PR commit; pushes to main refresh the baseline `.lake` snapshot.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lake-cache
        with:
          path: .lake
          key: lake-cuda-13.3.1-ubuntu26-x86-64-v4-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lake-cuda-13.3.1-ubuntu26-x86-64-v4-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      # Share a single Cargo target directory across all CUDA compile/link steps
      # so Plonky3, multi-stark, and CUDA kernels compile once instead of twice.
      - name: Compile CUDA Rust targets
        run: cargo check --release --locked --workspace --all-targets --features ix-ffi/parallel,ix-ffi/cuda,ix-proof-compression/cuda,ixvm/cuda,stark-verifier/cuda,ix-prover/cuda
      - name: Link separate Aiur CUDA hosts
        run: cargo build --release --locked -p ixvm -p stark-verifier -p ix-prover --features parallel,cuda --bin ixvm-proof --bin stark-verifier --bin ix-prover
      - name: Link a CUDA-enabled Lean executable
        run: IX_CUDA=1 lake build ix
      - name: Save Lean cache on main
        if: needs.changes.outputs.is_push == 'true' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-cuda-13.3.1-ubuntu26-x86-64-v4-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}


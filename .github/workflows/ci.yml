name: CI Jobs

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-tests:
    name: Merge tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Defer tests to merge queue
        run: echo "Merge tests run against the merge group's synthetic commit."

  # Build every regular Lake target before the test fan-out. The Namespace
  # volume is committed only after this job succeeds, so every saved build
  # cache contains the complete build rather than one parallel job's subset.
  # The small `nataddcomm.ixe` fixture is passed separately to the zkVM jobs.
  build:
    runs-on:
      - nscloud-ubuntu-26.04-amd64-16x32-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail -v"
          test: false
          use-github-cache: false
      # build-all lint driver compiles every lib/exe target with --wfail, so a
      # warning in any target (exes, benchmarks, Apps) — not just the default lib
      # lean-action builds above — fails CI.
      - name: Build all targets
        run: lake lint -- --wfail -v
      - name: Build Ix.Tc formal verification
        run: lake build IxTcVerify
      - name: Check codegen'd IxVM kernel is up to date
        run: lake exe ix codegen --check
      - name: Check Lean versions match for Ix and compiler bench
        run: diff lean-toolchain Benchmarks/Compile/lean-toolchain
      # `Nat.add_comm`'s transitive-dependency closure (~40 kB, ~40 constants)
      # is a real theorem, not an empty environment. `--consts` keeps this much
      # smaller than the complete Init+Std environment used by benchmarks. The
      # zkVM execution gates download this artifact and run their guests over it.
      - name: Compile nataddcomm.ixe
        run: lake exe ix compile Ix.lean --consts Nat.add_comm --out nataddcomm.ixe
      - name: Upload nataddcomm.ixe
        uses: actions/upload-artifact@v7
        with:
          name: nataddcomm-ixe
          path: nataddcomm.ixe
          if-no-files-found: error
          retention-days: 1

  # The primary Lean test tier consumes the completed build cache read-only.
  # Within this workflow, build and rust-test are the only ordered writers.
  lean-test:
    needs: build
    runs-on:
      - nscloud-ubuntu-26.04-amd64-16x32-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix
      - nscloud-cache-exp-do-not-commit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          test: true
          use-github-cache: false
      - name: Test Ix CLI
        run: lake test --wfail -- cli

  # Lake and root Cargo builds both use the repository's target directory, so
  # build and rust-test share a volume in dependency order. Namespace volumes
  # are last-write-wins; parallel zkVM writers use dedicated tags, while CUDA
  # consumes the primary cache without committing its feature-specific output.
  # Namespace's remote sccache could share compatible compilation units across
  # the zkVM volumes without serializing the jobs.
  rust-test:
    needs: build
    runs-on:
      - nscloud-ubuntu-26.04-amd64-8x16-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
      - uses: taiki-e/install-action@nextest
      # Install Lean for rust-bindgen step
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Check Rustfmt code style
        uses: actions-rust-lang/rustfmt@v1
      - name: Check clippy warnings
        run: cargo clippy --release --workspace --all-targets --features ix-ffi/parallel,ix-ffi/net,ix-ffi/test-ffi -- -D warnings
      - name: Check *everything* compiles
        run: cargo check --release --workspace --all-targets --features ix-ffi/parallel,ix-ffi/net,ix-ffi/test-ffi
      - name: Tests
        run: cargo nextest run --release --profile ci --workspace
      - name: Get Rust version
        run: |
          echo "RUST_VERSION=$(awk -F '"' '/^channel/ {print $2}' rust-toolchain.toml)" | tee -a $GITHUB_ENV
      - name: Cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: ${{ env.RUST_VERSION }}

  # Compile and link the opt-in backend without requiring a GPU. Runtime and
  # proof-byte equivalence are covered by multi-stark's NVIDIA smoke suite.
  cuda-compile:
    needs: build
    runs-on:
      - nscloud-ubuntu-26.04-amd64-8x16-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix
      - nscloud-cache-exp-do-not-commit
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
      env:
        NSC_CACHE_PATH: ${{ env.NSC_CACHE_PATH }}
      volumes:
        - /cache:/cache
      options: --cap-add=SYS_ADMIN
    env:
      # This job validates feature plumbing and the Rust-staticlib-to-Lean
      # link without paying for a GPU runner. Multi-stark CI compiles the
      # complete supported cubin set; one representative architecture is
      # sufficient for this downstream integration gate.
      MULTI_STARK_CUDA_ARCHS: "80"
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain bootstrap dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git libclang-dev sudo
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Compile CUDA Rust targets
        run: cargo check --release --locked --workspace --all-targets --features ix-ffi/parallel,ix-ffi/cuda
      - name: Link a CUDA-enabled Lean executable
        run: IX_CUDA=1 lake build bench-typecheck

  # zkVM host build + execute gate: do the Zisk/SP1 hosts (and their guest
  # ELFs, via each workspace's build.rs) still compile AND run? rust-test
  # doesn't build these workspaces because they need special toolchains. These
  # jobs are the red-X signal: each builds its host, then runs the guest in the
  # VM over `nataddcomm.ixe` (a ~40-constant closure the `build` job publishes
  # as an artifact). They run in parallel with the test jobs and with each
  # other after `build` succeeds. Both hosts exit
  # non-zero when the kernel rejects a constant (sp1: EXIT_REJECTED; zisk:
  # `reject_failures`), so a guest that compiles but panics / faults / rejects
  # fails the job. Both execute paths are keyless: Zisk uses its SDK's
  # standalone execute-only client, which retains the ASM executor without
  # initializing the prover. SP1 and Zisk build as independent jobs so they
  # parallelize; each installs only its own toolchain via sp1up / ziskup.
  sp1-build:
    name: SP1 host build
    needs: build
    runs-on:
      - nscloud-ubuntu-26.04-amd64-8x16-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix-sp1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
        with:
          additional-paths: |
            ${{ github.workspace }}/sp1/target
            ${{ github.workspace }}/sp1/guest/target
      - uses: ./.github/actions/install-sp1
      # The precompile-aware SP1 runner-binary is auto-built from the fork git
      # dep by `sp1-core-executor-runner`'s build script — no manual override.
      # `cargo test` reuses the build's dep graph and runs the host's unit
      # tests — the clap surface `ix bench run` drives (`--consts` comma-splitting,
      # `--consts-file` union/dedup), so a CLI regression reds this gate too.
      - name: Build + test sp1-host (guest ELF via build.rs)
        run: |
          cd sp1
          cargo build --release --bin sp1-host
          cargo test --release --bin sp1-host
          # --release shares the build's dep artifacts. Under clippy,
          # sp1-build skips the guest compilation and the host cfg-gates its
          # ELF embed accordingly, so this lints host code only.
          cargo clippy --release --workspace --all-targets
      - name: Download nataddcomm.ixe
        uses: actions/download-artifact@v8
        with:
          name: nataddcomm-ixe
          path: .
      # Run the guest ELF in SP1's RISC-V executor over the nataddcomm env —
      # pure emulation, no GPU or proving key. `--execute` exits 3
      # (EXIT_REJECTED) if the kernel rejects any constant and non-zero on any
      # VM fault, so this reds the gate on a guest that compiles but doesn't run.
      - name: Execute sp1-guest over the nataddcomm env
        run: cargo run --release --bin sp1-host -- --execute --ixe ../nataddcomm.ixe
        working-directory: sp1
        env:
          RUST_LOG: info

  zisk-build:
    name: Zisk host build
    needs: build
    runs-on:
      - nscloud-ubuntu-26.04-amd64-8x16-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-argumentcomputer-ix-zisk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: ./.github/actions/setup-lake-cache
        with:
          additional-paths: |
            ${{ github.workspace }}/zisk/target
            ${{ github.workspace }}/zisk/guest/target
            ${{ github.workspace }}/zisk/agg-guest/target
      - uses: ./.github/actions/install-zisk
        with:
          proving-key: false
      # Unit tests: the clap surface `ix bench run` drives, plus the closure auditor
      # (closure_detects_missing_dep self-skips without an IX_TEST_IXE
      # fixture — this gate has no Lean build to produce one).
      - name: Build + test zisk-host (guest ELF via build.rs)
        run: |
          cd zisk
          cargo build --release --bin zisk-host
          cargo test --release --bin zisk-host
          # --release shares the build's dep artifacts (including the guest
          # ELFs its build scripts already produced).
          cargo clippy --release --workspace --all-targets
      - name: Download nataddcomm.ixe
        uses: actions/download-artifact@v8
        with:
          name: nataddcomm-ixe
          path: .
      # Run the guest ELF through Zisk's keyless ASM executor. `zisk-host` exits
      # 3 (EXIT_REJECTED, via `reject_failures`) if the kernel rejects any
      # constant and non-zero on any VM fault. The ASM executor mmaps with
      # MAP_LOCKED, so raise the memlock limit for the tool it spawns.
      - name: Execute zisk-guest over the nataddcomm env
        working-directory: zisk
        env:
          RUST_LOG: info
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo run --release --bin zisk-host -- --execute --ixe ../nataddcomm.ixe

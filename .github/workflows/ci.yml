      - name: Check Aiur compression compiler fixtures
        run: bash tools/check-aiur-compression-fixtures.sh
      - name: Check IxVM execution fixture
        run: |
          tmp=$(mktemp -d)
          lake env IxVM/.lake/build/bin/ixvm export "$tmp/ixvm-execution.ixa"
          target/release/ixvm "$tmp/ixvm-execution.ixa" negative
          target/release/ixvm "$tmp/ixvm-execution.ixa" validate IxVM/IxVM/fixtures/nat-add-comm.ixf
          rm -rf "$tmp"
      - name: Check the formal verifying keys match their pins
        run: bash tools/check-formal-keys.sh

  # Dedicated lineage for the 944-module IxVMRefinement library so it runs in
  # parallel from t=0 without competing for sticky-disk space with host/formal.
  ixvm-refinement:
    name: IxVM refinement proofs & axioms
    needs: changes
    if: needs.changes.outputs.run_refinement == 'true'
    runs-on: runs-on=${{ github.run_id }}-ixvm-refinement-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-refinement-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Check generated proof mirrors and build IxVMRefinement
        env:
          IS_PUSH: ${{ needs.changes.outputs.is_push }}
        run: |
          if [ "$IS_PUSH" != "true" ]; then
            lake exe ixvm/ixvm-proof-gen --check
          fi
          lake build --wfail IxVMRefinement \
            IxVM.CompiledCert \
            IxVMRefinement.Endpoint.Companions \
            Ix.IxVM.ConsistencyAudit Ix.IxVM.ConsistencyModelAudit Ix.IxVM.Refinement.Audit Ix.Cert.Compile \
            Ix.Cert.MultiStark.Audit Ix.Cert.MultiStarkRefinement.Audit \
            Ix.Cert.Aggr.Audit Ix.Cert.Compression.Audit Ix.Cert.IxccAiur.Audit \
            Ix.Cert.RecordSectionsBridge
          if [ "$IS_PUSH" != "true" ]; then
            lake env lean --run Scripts/CheckCiFilters.lean
            pinned=$(sed -n 's/^def pinnedDigest : String := "\([0-9a-f]\{64\}\)".*/\1/p' IxVMRefinement/Endpoint/ClosureManifest.lean)
            test -n "$pinned"
            printf '%s  Tests/Fixtures/circuit-composed-closure-manifest.txt\n' "$pinned" | sha256sum -c -
            lake env leanchecker \
              IxVM.CompiledCert \
              IxVMRefinement.Endpoint.ComposedResidual \
              IxVMRefinement.Endpoint.ClosureAudit \
              IxVMRefinement.Endpoint.Companions \
              IxVMRefinement.Endpoint.ConsistencyCorollary \
              IxVMRefinement.Endpoint.ComposedResidualAudit \
              Ix.IxVM.ConsistencyAudit \
              Ix.IxVM.ConsistencyModelAudit \
              Ix.IxVM.Refinement.Audit \
              Ix.Cert.Compile \
              Ix.Cert.MultiStark.Audit \
              Ix.Cert.MultiStarkRefinement.Audit \
              Ix.Cert.Aggr.Audit \
              Ix.Cert.Compression.Audit \
              Ix.Cert.IxccAiur.Audit \
              Ix.Cert.RecordSectionsBridge
            tmp=$(mktemp -d)
            {
              echo "import IxC.Kernel.Audit.Axioms"
              find IxVMRefinement -name '*.lean' -not -path 'IxVMRefinement/Obs/*' | sort |
                sed -e 's/\.lean$//' -e 's#/#.#g' -e 's/^/import /'
              echo "#guard_module_axioms_under IxVMRefinement Ix.IxVM.Consistency IxC.Kernel.Model IxC.Kernel.Semantics"
            } > "$tmp/RefinementAxioms.lean"
            lake env lean -DwarningAsError=true "$tmp/RefinementAxioms.lean"
            rm -rf "$tmp"
          fi


  # Normalizer between path-filtered jobs and runs-on/spot-retry-gate:
  # spot-retry-gate requires every job in `job_results` to be `success`, so
  # legitimately skipped jobs would otherwise fail the gate. This job verifies
  # that every planned job succeeded (rejecting failures, cancellations, and
  # cascading skips) while keeping RunsOn's Spot interruption detection intact.
  check-results:
    name: Validate job results
    if: ${{ always() }}
    needs:
      - changes
      - lints
      - quick-checks
      - rust-test
      - cuda-compile
      - gnark-test
      - contracts-test
      - host-build
      - host-test-primary
      - host-test-cli
      - host-audits-lint
      - host-test-landing
      - host-test-closures
      - host-test-misc
      - certified-kernel
      - valgrind-ffi
      - formal-build-export
      - formal-unit-tests
      - ixvm-refinement
      - formal-check
      - ixvm-tier-tests
      - binding-proof-cli
    runs-on: ubuntu-latest
    steps:
      - name: Verify planned jobs succeeded
        env:
          R_CHANGES: ${{ needs.changes.result }}
          E_LINTS: ${{ needs.changes.outputs.run_lints }}
          R_LINTS: ${{ needs.lints.result }}
          E_QUICK: ${{ needs.changes.outputs.run_quick }}
          R_QUICK: ${{ needs.quick-checks.result }}
          E_RUST: ${{ needs.changes.outputs.run_rust }}
          R_RUST: ${{ needs.rust-test.result }}
          E_CUDA: ${{ needs.changes.outputs.run_cuda }}
          R_CUDA: ${{ needs.cuda-compile.result }}
          E_GNARK: ${{ needs.changes.outputs.run_gnark }}
          R_GNARK: ${{ needs.gnark-test.result }}
          E_CONTRACTS: ${{ needs.changes.outputs.run_contracts }}
          R_CONTRACTS: ${{ needs.contracts-test.result }}
          E_HOST_BUILD: ${{ needs.changes.outputs.run_host_build }}
          R_HOST_BUILD: ${{ needs.host-build.result }}
          E_HOST_FAST: ${{ needs.changes.outputs.run_host_fast }}
          R_HOST_PRIMARY: ${{ needs.host-test-primary.result }}
          R_HOST_CLI: ${{ needs.host-test-cli.result }}
          R_HOST_LINT: ${{ needs.host-audits-lint.result }}
          E_HOST_HEAVY: ${{ needs.changes.outputs.run_host_heavy }}
          R_HOST_LANDING: ${{ needs.host-test-landing.result }}
          R_HOST_CLOSURES: ${{ needs.host-test-closures.result }}
          R_HOST_MISC: ${{ needs.host-test-misc.result }}
          E_KERNEL: ${{ needs.changes.outputs.run_kernel }}
          R_KERNEL: ${{ needs.certified-kernel.result }}
          E_VALGRIND: ${{ needs.changes.outputs.run_valgrind }}
          R_VALGRIND: ${{ needs.valgrind-ffi.result }}
          E_FORMAL_BUILD: ${{ needs.changes.outputs.run_formal_build }}
          R_FORMAL_BUILD: ${{ needs.formal-build-export.result }}
          E_FORMAL_TESTS: ${{ needs.changes.outputs.run_formal_tests }}
          R_FORMAL_UNIT: ${{ needs.formal-unit-tests.result }}
          R_FORMAL_CHECK: ${{ needs.formal-check.result }}
          R_IXVM_TIER: ${{ needs.ixvm-tier-tests.result }}
          R_BINDING_PROOF: ${{ needs.binding-proof-cli.result }}
          E_REFINEMENT: ${{ needs.changes.outputs.run_refinement }}
          R_REFINEMENT: ${{ needs.ixvm-refinement.result }}
        run: |
          if [ "$R_CHANGES" != "success" ]; then
            echo "::error::changes job ended with $R_CHANGES"
            exit 1
          fi
          failed=0
          check_job() {
            local name="$1" expected="$2" result="$3"
            if [ "$expected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::planned job '$name' ended with '$result'"
                failed=1
              fi
            else
              if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
                echo "::error::unplanned job '$name' ended with '$result'"
                failed=1
              fi
            fi
          }
          check_job lints "$E_LINTS" "$R_LINTS"
          check_job quick-checks "$E_QUICK" "$R_QUICK"
          check_job rust-test "$E_RUST" "$R_RUST"
          check_job cuda-compile "$E_CUDA" "$R_CUDA"
          check_job gnark-test "$E_GNARK" "$R_GNARK"
          check_job contracts-test "$E_CONTRACTS" "$R_CONTRACTS"
          check_job host-build "$E_HOST_BUILD" "$R_HOST_BUILD"
          check_job host-test-primary "$E_HOST_FAST" "$R_HOST_PRIMARY"
          check_job host-test-cli "$E_HOST_FAST" "$R_HOST_CLI"
          check_job host-audits-lint "$E_HOST_FAST" "$R_HOST_LINT"
          check_job host-test-landing "$E_HOST_HEAVY" "$R_HOST_LANDING"
          check_job host-test-closures "$E_HOST_HEAVY" "$R_HOST_CLOSURES"
          check_job host-test-misc "$E_HOST_HEAVY" "$R_HOST_MISC"
          check_job certified-kernel "$E_KERNEL" "$R_KERNEL"
          check_job valgrind-ffi "$E_VALGRIND" "$R_VALGRIND"
          check_job formal-build-export "$E_FORMAL_BUILD" "$R_FORMAL_BUILD"
          check_job formal-unit-tests "$E_FORMAL_TESTS" "$R_FORMAL_UNIT"
          check_job formal-check "$E_FORMAL_TESTS" "$R_FORMAL_CHECK"
          check_job ixvm-tier-tests "$E_FORMAL_TESTS" "$R_IXVM_TIER"
          check_job binding-proof-cli "$E_FORMAL_TESTS" "$R_BINDING_PROOF"
          check_job ixvm-refinement "$E_REFINEMENT" "$R_REFINEMENT"
          exit "$failed"

  ci-gate:
    if: ${{ always() }}
    needs: [check-results]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}

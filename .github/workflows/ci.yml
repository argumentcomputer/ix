  certified-kernel:
    name: Certified kernel & set-theory model
    needs: changes
    if: needs.changes.outputs.run_kernel == 'true'
    runs-on: runs-on=${{ github.run_id }}-certified-kernel-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-kernel-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target,path=Models/SetTheory/.lake
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      # Tests.Ix.Kernel.ModelLaws imports Ix.IxVM.Consistency.Restrict (which
      # reaches Mathlib), so keep Mathlib oleans on this dedicated lineage.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Fetch pinned set-theory dependencies
        run: |
          lake -d Models/SetTheory exe cache get \
            Mathlib.SetTheory.Cardinal.Regular \
            Mathlib.SetTheory.ZFC.VonNeumann \
            Mathlib.SetTheory.ZFC.Cardinal
      - name: Warm kernel build caches on main
        if: needs.changes.outputs.is_push == 'true'
        run: |
          lake -d IxC build --wfail
          lake -d Models/SetTheory build --wfail
          lake build --wfail \
            Ix.Cert.Audit Ix.Cert.RuntimeAudit Ix.Ixon.BlockOrder.Audit IxSharingVerify \
            kernel-layering kernel-trust-surface kernel-entry-cases kernel-meta-names
      - name: Check certified kernel, host audits, model, fences, entry cases and meta names
        if: needs.changes.outputs.is_push != 'true'
        run: |
          lake env lean --run Scripts/CheckCiFilters.lean
          lake run check-kernel --with-model
          lake build --wfail Ix.Cert.Audit Ix.Cert.RuntimeAudit Ix.Ixon.BlockOrder.Audit IxSharingVerify
          pinned_cb=$(sed -n 's/^def pinnedDigest : String := "\([0-9a-f]\{64\}\)".*/\1/p' IxC/Kernel/Admission/ClosureManifest.lean)
          test -n "$pinned_cb"
          printf '%s  Tests/Fixtures/check-bytes-closure-manifest.txt\n' "$pinned_cb" | sha256sum -c -
          pinned_cc=$(sed -n 's/^def pinnedDigest : String := "\([0-9a-f]\{64\}\)".*/\1/p' Ix/Cert/ClosureManifest.lean)
          test -n "$pinned_cc"
          printf '%s  Tests/Fixtures/compile-correct-closure-manifest.txt\n' "$pinned_cc" | sha256sum -c -
          lake env leanchecker \
            IxC.Kernel.Audit.Roots \
            IxC.Kernel.Admission.Audit \
            Ix.Ixon.Authenticated.Audit \
            Ix.Ixon.BlockOrder.Audit \
            Ix.HostAdmission.Audit \
            Ix.Cert.ModuleAudit \
            Ix.Cert.Audit \
            Ix.Cert.RuntimeAudit \
            IxSharingVerify.Audit.Statements \
            IxSharingVerify.Audit.CompiledCode \
            IxSharingVerify.Audit.SorryFrontier
          lake -d Models/SetTheory env leanchecker IxSetTheoryModel.Audit
      - name: Bootstrap IxC certified kernel check (WS 2C)
        if: needs.changes.outputs.is_push != 'true'
        run: |
          lake build --wfail ix kernel-check-ixe
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          public_roots="Ix.Kernel.Admission.checkBytes_has_model,Ix.Kernel.Admission.checkBytesWith_has_model,Ix.Kernel.Admission.checkConstants_has_model,Ix.Kernel.Admission.checkConstantsWith_has_model,Ix.Kernel.Admission.checkBytes_has_model_values,Ix.Kernel.Admission.checkBytesWith_has_model_values,Ix.Kernel.Admission.checkBytes_no_proof_of_False,Ix.Kernel.Admission.checkBytesWith_no_proof_of_False,Ix.Kernel.Admission.checkBytes_no_False_theorem,Ix.Kernel.Admission.checkBytesWith_no_False_theorem,Ix.Kernel.Admission.checkBytesWith_no_False_reference,Ix.Kernel.Admission.checkBytes_authentic,Ix.Kernel.Admission.checkBytesWith_authentic,Ix.Kernel.Admission.checkBytes_binding,Ix.Kernel.Admission.checkBytesWith_binding,Ix.Kernel.Admission.checkConstantsAt_has_model,Ix.Kernel.Admission.checkBytes_resources,Ix.Kernel.Admission.checkBytesWith_resources,Ix.Kernel.model_exists,Ix.Kernel.no_False_theorem_accepted"
          lake env .lake/build/bin/ix compile --no-build --workers 8 --consts "$public_roots" IxC/Kernel/Audit/Roots.lean --out "$tmp/roots.ixe"
          lake env .lake/build/bin/kernel-check-ixe --strict --jobs 8 "$tmp/roots.ixe" "$tmp/roots.jsonl"
          lake env .lake/build/bin/kernel-check-ixe --entry --allow-dropped --require-roots "$public_roots" authenticated "$tmp/roots.ixe"

  valgrind-ffi:
    name: Valgrind FFI
    needs: changes
    if: needs.changes.outputs.run_valgrind == 'true'
    runs-on: runs-on=${{ github.run_id }}-valgrind-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: generic
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: valgrind-lake-cache
        with:
          path: ./.lake
          key: lake-valgrind-x64-generic-nomathlib-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lake-valgrind-x64-generic-nomathlib-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-
      # `ffi-tests` never imports Mathlib; disable Mathlib cache so we do not
      # download or cache 7.5 GB of unused Mathlib oleans.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build and run FFI suite under Valgrind
        run: |
          lake build --wfail ffi-tests
          .lake/build/bin/ffi-tests
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          IX_VALGRIND=1 valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=.github/valgrind.supp \
            .lake/build/bin/ffi-tests
      - name: Save Valgrind Lean cache on main
        if: needs.changes.outputs.is_push == 'true' && steps.valgrind-lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.lake
          key: lake-valgrind-x64-generic-nomathlib-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}

  # Build formal packages + Rust hosts once, restore or export `.ixa` artifacts
  # in parallel, and publish `.ixa` + Rust hosts to S3 cache for downstream jobs.
  formal-build-export:
    name: Formal build & .ixa export
    needs: changes
    if: needs.changes.outputs.run_formal_build == 'true'
    runs-on: runs-on=${{ github.run_id }}-formal-build-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-formal-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build formal packages, exporters and check drivers
        run: |
          lake build --wfail \
            ix formal-aiur-tests formal-aggregate-tests formal-checks formal-package-tests \
            aiur/Aiur ixvm/IxVM multiStark/MultiStark \
            aiur/aiur_tests aiur/execution_tests aiur/trace_tests \
            aiur/u32_tests aiur/library_tests aiur/grouping_example aiur/depth_example \
            aiur/Aiur.Library.U8Facts aiur/axiom_sweep \
            ixvm/ixvm multiStark/stark-export
      - name: Restore Rust formal hosts from S3 cache if already saved
        id: hosts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-hosts
          key: formal-hosts-v1-x86-64-v4-${{ github.sha }}
      - name: Build Rust formal hosts (unified features)
        run: |
          cargo build --release --locked \
            -p ixvm -p stark-verifier -p ix-prover -p aiur \
            --features aiur/parallel,ixvm/parallel,stark-verifier/parallel,ix-prover/parallel \
            --bin ixvm --bin ixvm-proof --bin stark-verifier --bin ix-prover \
            --example claim_fixture --example library_check
          mkdir -p "${{ runner.temp }}/ci-hosts"
          cp target/release/ixvm-proof target/release/stark-verifier target/release/ix-prover "${{ runner.temp }}/ci-hosts/"
      - name: Save Rust formal hosts to S3 cache
        if: steps.hosts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-hosts
          key: formal-hosts-v1-x86-64-v4-${{ github.sha }}
      - name: Restore content-addressed .ixa artifacts from S3 cache
        id: ixa-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-artifacts
          key: ${{ needs.changes.outputs.ixa_key }}
      - name: Export .ixa artifacts in parallel on cache miss
        if: steps.ixa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ci-artifacts"
          lake env IxVM/.lake/build/bin/ixvm export-claim-trace "${{ runner.temp }}/ci-artifacts/ixvm.ixa" &
          p1=$!
          lake env MultiStark/.lake/build/bin/stark-export export-trace "${{ runner.temp }}/ci-artifacts/recursion.ixa" &
          p2=$!
          lake env MultiStark/.lake/build/bin/stark-export export-trace "${{ runner.temp }}/ci-artifacts/aggregate.ixa" --aggregate &
          p3=$!
          wait "$p1" "$p2" "$p3"
      - name: Save .ixa artifacts to S3 cache
        if: steps.ixa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-artifacts
          key: ${{ needs.changes.outputs.ixa_key }}
      - name: Record built revision
        env:
          BUILT_SHA: ${{ github.sha }}
        run: echo "$BUILT_SHA" > .lake/formal-build-revision

  formal-unit-tests:
    name: Formal unit tests, coverage & fixtures
    needs: [changes, formal-build-export]

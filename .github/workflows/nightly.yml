name: Nightly Sweeps

on:
  schedule:
    # 06:00 UTC daily on main: runs the heavy full adversarial sweeps and
    # unfiltered Nix check demoted from the PR critical path.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-sweeps:
    name: Nightly full IxVM & BLAKE3 sweeps
    runs-on: runs-on=${{ github.run_id }}-nightly-sweeps-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=ci-formal-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compute git-tree .ixa cache key
        id: ixa-key
        run: |
          ixa_hash=$(git rev-parse \
            HEAD:lean-toolchain HEAD:lake-manifest.json \
            HEAD:Aiur HEAD:IxVM HEAD:MultiStark | sha256sum | cut -d' ' -f1)
          echo "key=ixa-v2-${ixa_hash}" >> "$GITHUB_OUTPUT"
      - name: Build IxTests, IxVMTests, ix and IxVM exporter
        run: |
          lake build --wfail IxTests IxVMTests ix ixvm/ixvm
          cargo build --release --locked -p ixvm -p stark-verifier -p ix-prover \
            --features aiur/parallel,ixvm/parallel,stark-verifier/parallel,ix-prover/parallel \
            --bin ixvm-proof --bin stark-verifier --bin ix-prover
      - name: Restore or export ixvm.ixa
        id: ixa-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-artifacts
          key: ${{ steps.ixa-key.outputs.key }}
      - name: Export ixvm.ixa on cache miss
        if: steps.ixa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ci-artifacts"
          lake env IxVM/.lake/build/bin/ixvm export-claim-trace "${{ runner.temp }}/ci-artifacts/ixvm.ixa"
      - name: Compile Init+Std reference artifact for admission-hash-diff-initstd
        run: lake env .lake/build/bin/IxTests initstd-reference
      - name: Run ci:nightly host sweeps
        run: lake env .lake/build/bin/IxTests --tier ci:nightly
      - name: Run ci:nightly-ixvm sweeps
        env:
          IX_AIUR_ARTIFACT: ${{ runner.temp }}/ci-artifacts/ixvm.ixa
          IX_AIUR_HOST: ${{ github.workspace }}/target/release/ixvm-proof
          IX_PROVER_HOST: ${{ github.workspace }}/target/release/ix-prover
          IX_STARK_HOST: ${{ github.workspace }}/target/release/stark-verifier
        run: lake env .lake/build/bin/IxVMTests --tier ci:nightly-ixvm

  nightly-nix-check:
    name: Nightly Nix sandboxed ix-tests
    env:
      RUSTFLAGS: -Ctarget-cpu=x86-64-v4 -Ctarget-feature=+avx512vbmi2,+gfni
    runs-on: runs-on=${{ github.run_id }}-nightly-nix-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=150gb/sticky=nix-x86-64-v4:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: $/.github/actions/authenticate-github-fetches
      - name: Run full sandboxed Nix flake check
        run: nix flake check --print-build-logs --accept-flake-config

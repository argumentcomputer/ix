name: Merge tests

on:
  push:
    branches: [ix.ci-merge-tests]
  merge_group:
  # `!merge-tests` on a PR: the relay job dispatches this workflow on the
  # PR's branch, so the run carries the branch's ref. RunsOn files the
  # sticky-disk snapshot under the run's ref, and a comment event's ref is
  # the default branch; dispatching keeps a PR's build out of `main`'s
  # cache while still reading from it.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose test merge commit to run
        required: true

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Merge tests for PR #{0}', inputs.pr) || (github.event_name == 'issue_comment' && 'Relay merge-tests comment' || 'Merge tests') }}"

permissions:
  contents: read

# Each merge group must report its own result to the queue. A cancelled run
# cannot satisfy the required check, so merge-group runs are never
# superseded: every run outside workflow_dispatch gets a group of its own.
# A newer `!merge-tests` on the same PR does cancel the older dispatched run,
# whose result is moot.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-pr-{1}', github.workflow, inputs.pr) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  relay:
    name: Relay !merge-tests comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '!merge-tests') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      # issue_comment doesn't carry the PR's head; this action looks it up.
      - uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3.0.0
        id: comment-branch
      - name: Dispatch on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ steps.comment-branch.outputs.head_ref }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh workflow run merge-tests.yml --ref "$HEAD_REF" -f pr="$PR_NUMBER"
      - name: Report that merge tests could not start
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## ❌ Merge tests could not start

            See the [relay logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  prepare:
    name: Prepare merge tests
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
      pr: ${{ steps.target.outputs.pr }}
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - name: Resolve test revision
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || { echo "::error::PR number must be a positive integer"; exit 1; }
            revision=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.merge_commit_sha // empty')
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            revision=$EVENT_SHA
          fi

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::PR does not currently have a test merge commit"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Compose initial comment
        if: github.event_name == 'workflow_dispatch'
        env:
          MERGE_SHA: ${{ steps.target.outputs.revision }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          {
            echo "## ⏳ Merge tests running…"
            echo
            echo "Running the ignored test suite for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[In-progress logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Post initial comment
        if: github.event_name == 'workflow_dispatch'
        id: post
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ steps.target.outputs.pr }}
          body-path: comment-body.md

      - name: Report that merge tests could not start
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ inputs.pr }}
          body: |
            ## ❌ Merge tests could not start

            A PR that conflicts with its base has no test merge commit to run. See the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  # The producer saves the built targets and their revision on the shared
  # sticky lineage. Partitions check that revision before any local builds
  # and leave the producer's snapshot intact.
  build:
    name: Build merge-test targets
    needs: prepare
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    # On-demand, as the partitions are: every partition waits for it.
    runs-on: runs-on=${{ github.run_id }}-merge-build-${{ github.run_attempt }}/cpu=32/family=r7i+r8i+r7a+r8a/spot=false/image=ubuntu26-full-x64/volume=100gb/sticky=ci-lean-test-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_save: true
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target,path=Models/SetTheory/.lake
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false

      - name: Fetch pinned set-theory dependencies
        run: |
          lake -d Models/SetTheory exe cache get \
            Mathlib.SetTheory.Cardinal.Regular \
            Mathlib.SetTheory.ZFC.VonNeumann \
            Mathlib.SetTheory.ZFC.Cardinal

      # The kernel gate's strict list of audit modules (`lake run
      # check-kernel`) is left to the kernel partition: its modules are
      # leaves over the closures built here.
      - name: Build the partitions' targets
        run: |
          lake build --wfail IxTests Apps.ZKVoting.Prover
          lake -d IxC build --wfail
          lake -d Models/SetTheory build --wfail
          lake build --wfail Ix.Cert.Audit kernel-layering kernel-trust-surface kernel-entry-cases kernel-meta-names

      - name: Record the built revision
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: echo "$TEST_REVISION" > .lake/merge-build-revision

  merge-tests:
    name: ${{ matrix.name }}
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lake ignored tests (compiler closures)
            kind: lake
            test_args: --tier ci:compiler-closures
          - name: Lake ignored tests (misc)
            kind: lake
            test_args: --tier ci:misc
            zk_voting: true
          - name: Lake ignored tests (landing, Init+Std through ix)
            kind: lake
            test_args: --tier ci:landing-initstd-cli
          - name: Certified kernel
            kind: kernel
    # On-demand rather than Spot: a reclaimed partition restarts from scratch
    # only after the whole attempt finishes, and the longest partitions
    # already run close to the merge queue's status-check timeout, so one
    # reclaim is enough to dequeue the PR.
    #
    # The sticky disk is ci.yml's lean-test lineage: same toolchain, same
    # portable codegen, same cached paths, and that job's push-to-main runs
    # are what keep the lineage's `main` snapshot fresh. The revision check
    # below distinguishes the producer's build from an older snapshot.
    runs-on: runs-on=${{ github.run_id }}-merge-tests-${{ github.run_attempt }}-${{ strategy.job-index }}/cpu=32/family=r7i+r8i+r7a+r8a/spot=false/image=ubuntu26-full-x64/volume=100gb/sticky=ci-lean-test-x86-64-v4-100gb:100gb/extras=s3-cache
    steps:
      - name: Validate merge-test variant
        env:
          TEST_KIND: ${{ matrix.kind }}
        run: |
          case "$TEST_KIND" in
            lake|kernel) ;;
            *) echo "::error::Unknown merge-test variant: $TEST_KIND"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      # sccache keys rustc outputs by content, so the workspace crates, which
      # cargo rebuilds after every fresh checkout because their mtimes moved,
      # come back as cache hits (see ci.yml).
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_save: false
          sticky_cache: |
            rust
            custom,path=.lake,path=Aiur/.lake,path=IxVM/.lake,path=MultiStark/.lake,path=target,path=Models/SetTheory/.lake
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false

      - name: Check for the build job's snapshot
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          restored_revision=$(cat .lake/merge-build-revision 2>/dev/null || true)
          if [ "$restored_revision" = "$TEST_REVISION" ]; then
            cache_result=hit
            echo "Restored the build job's snapshot of $TEST_REVISION"
          else
            cache_result=miss
            echo "::warning::Sticky build cache miss: expected $TEST_REVISION, restored ${restored_revision:-missing}; this partition builds its own targets"
          fi
          {
            echo "### Sticky build cache"
            echo "- Result: $cache_result"
            echo "- Expected revision: \`$TEST_REVISION\`"
            echo "- Restored revision: \`${restored_revision:-missing}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ignored Lake test partition
        if: ${{ matrix.kind == 'lake' }}
        run: lake test --wfail -- ${{ matrix.test_args }}

      - name: Run ZK voting prover
        if: ${{ matrix.kind == 'lake' && matrix.zk_voting }}
        run: lake exe Apps.ZKVoting.Prover

      # The certified kernel gate (docs/kernel.md): the standalone IxC
      # package build, which has no dependencies and so proves the kernel needs
      # only the toolchain, then the host audits and kernel tests, the
      # set-theory model, the layering and trust-surface fences, the entry
      # cases, and the `.meta` and `.source` names.
      # The kernel artifacts come from .lake/kernel on the sticky disk. The
      # model lives in its own workspace so Mathlib stays out of the root
      # package; the producer warms its dependency and build caches. This
      # partition fetches any missing objects if it restores an older disk.
      - name: Fetch pinned set-theory dependencies
        if: ${{ matrix.kind == 'kernel' }}
        run: |
          lake -d Models/SetTheory exe cache get \
            Mathlib.SetTheory.Cardinal.Regular \
            Mathlib.SetTheory.ZFC.VonNeumann \
            Mathlib.SetTheory.ZFC.Cardinal
      - name: Check certified kernel, host audits, model, fences, entry cases and meta names
        if: ${{ matrix.kind == 'kernel' }}
        run: lake run check-kernel --with-model

  valgrind:
    name: Valgrind FFI
    needs: prepare
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    # Valgrind cannot decode AVX-512, so this job builds generic artifacts and
    # keeps them in the S3-backed actions cache under their own key rather
    # than sharing a sticky disk with the x86-64-v4 partitions.
    runs-on: runs-on=${{ github.run_id }}-valgrind-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: generic
      # `./.lake`, not `.lake`: the path string is hashed into the cache
      # entry's version, so the spelling must stay fixed for restores to hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.lake
          key: lake-valgrind-x64-generic-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lake-valgrind-x64-generic-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false

      # `ffi-tests` is the primary tier's `ffi` suite as an executable of its
      # own, whose import closure leaves out the test binary's proofs.
      - name: Build the FFI suite
        run: lake build --wfail ffi-tests

      - name: Run FFI tests normally
        run: .lake/build/bin/ffi-tests

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run tests under valgrind
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=.github/valgrind.supp \
            .lake/build/bin/ffi-tests

  merge-gate:
    if: ${{ always() && github.event_name != 'issue_comment' }}
    needs: [prepare, build, merge-tests, valgrind]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}

  report-merge-tests:
    name: Report merge tests
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.result == 'success'
    needs: [prepare, build, merge-tests, valgrind, merge-gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Compose result comment
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.merge-tests.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
          GATE_RESULT: ${{ needs.merge-gate.result }}
        run: |
          if [ "$GATE_RESULT" = success ] && [ "$BUILD_RESULT" = success ] && [ "$TEST_RESULT" = success ] && [ "$VALGRIND_RESULT" = success ]; then
            heading="## ✅ Merge tests passed"
            summary="All test partitions and Valgrind passed"
          elif [ "$GATE_RESULT" = success ]; then
            heading="## ⏳ Merge tests awaiting Spot retry"
            summary="RunsOn will retry the failed jobs"
          elif [ "$GATE_RESULT" = cancelled ] || [ "$BUILD_RESULT" = cancelled ] || [ "$TEST_RESULT" = cancelled ] || [ "$VALGRIND_RESULT" = cancelled ]; then
            heading="## ⚪ Merge tests cancelled"
            summary="Testing was cancelled (a newer \`!merge-tests\` supersedes an older run)"
          else
            heading="## ❌ Merge tests failed"
            summary="Tests failed or the merge-test gate could not verify their result"
          fi
          {
            echo "$heading"
            echo
            echo "$summary for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Update result comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ needs.prepare.outputs.pr }}
          comment-id: ${{ needs.prepare.outputs.comment-id }}
          edit-mode: replace
          body-path: comment-body.md

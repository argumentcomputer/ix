name: Merge tests

on:
  merge_group:
  issue_comment:
    types: [created]
  # Only the valgrind job runs on pull requests, as a trial of the
  # GitHub-hosted runner's build and cache times before it takes that role
  # in the queue permanently.
  pull_request:

run-name: "${{ github.event_name == 'issue_comment' && format('Merge tests for PR #{0}', github.event.issue.number) || 'Merge tests' }}"

permissions:
  contents: read

# Each merge group must report its own result to the queue. A cancelled run
# cannot satisfy the required check, so runs are never superseded here.

jobs:
  prepare:
    name: Prepare merge tests
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '!merge-tests') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
      pr: ${{ steps.target.outputs.pr }}
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - name: Resolve test revision
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = issue_comment ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || { echo "::error::PR number must be a positive integer"; exit 1; }
            revision=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.merge_commit_sha // empty')
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            revision=$EVENT_SHA
          fi

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::PR does not currently have a test merge commit"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Compose initial comment
        if: github.event_name == 'issue_comment'
        env:
          MERGE_SHA: ${{ steps.target.outputs.revision }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          {
            echo "## ⏳ Merge tests running…"
            echo
            echo "Running the ignored test suite for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[In-progress logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Post initial comment
        if: github.event_name == 'issue_comment'
        id: post
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ github.token }}
          issue-number: ${{ steps.target.outputs.pr }}
          body-path: comment-body.md

  merge-tests:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'issue_comment' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lake ignored tests (compile pipeline)
            kind: lake
            test_args: >-
              --ignored
              rust-canon-roundtrip serial-canon-roundtrip parallel-canon-roundtrip
              graph-cross condense-cross rust-serialize ixon-corpus
              rust-decompile validate-aux aux-gen-diff decompile-diff
          - name: Lake ignored tests (compile)
            kind: lake
            test_args: --ignored compile
          - name: Lake ignored tests (decompile)
            kind: lake
            test_args: --ignored decompile
          - name: Lake ignored tests (misc)
            kind: lake
            test_args: >-
              --ignored
              shard-map catalog-dedup commit-io fidelity-initstd
              kernel-ixon-roundtrip kernel-tutorial kernel-check-env kernel-check-const
              rust-kernel-build-primitives rust-kernel-build-prim-origs ixvm
            zk_voting: true
          - name: Ix.Tc unit and parity tests
            kind: tc
            test_args: >-
              tc-anon-diff tc-init tc-tutorial tc-roundtrip tc-ingress-meta
              tc-pins tc-accel-diff lean4lean
    runs-on: runs-on=${{ github.run_id }}-merge-tests-${{ github.run_attempt }}-${{ strategy.job-index }}/cpu=32/family=r8i.8xlarge/image=ubuntu24-full-x64/sticky=merge-tests-r8i-native:50gb:lazy-init/extras=s3-cache
    steps:
      - name: Validate merge-test variant
        env:
          TEST_KIND: ${{ matrix.kind }}
        run: |
          case "$TEST_KIND" in
            lake|tc) ;;
            *) echo "::error::Unknown merge-test variant: $TEST_KIND"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', needs.prepare.outputs.pr) || needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Verify test revision
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TEST_REVISION" ]; then
            echo "::error::PR merge ref changed before the run started; comment !merge-tests again"
            exit 1
          fi

      - uses: runs-on/action@v2
        with:
          sticky_cache: |
            rust
            custom,path=.lake,path=target
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false

      - name: Run ignored Lake test partition
        if: ${{ matrix.kind == 'lake' }}
        run: lake test --wfail -- ${{ matrix.test_args }}

      - name: Run ZK voting prover
        if: ${{ matrix.kind == 'lake' && matrix.zk_voting }}
        run: lake exe Apps.ZKVoting.Prover

      - name: Run Ix.Tc unit, parity, and regression tests
        if: ${{ matrix.kind == 'tc' }}
        run: |
          lake test --wfail -- tc-unit
          lake test --wfail -- --ignored ${{ matrix.test_args }}

  valgrind:
    name: Valgrind FFI
    needs: prepare
    # `prepare` is skipped on pull_request, so `!cancelled()` keeps this job
    # eligible there; the other events still require `prepare` to succeed.
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' ||
       (needs.prepare.result == 'success' &&
        (github.event_name == 'merge_group' || github.event_name == 'issue_comment')))
    # Valgrind cannot decode all native r8i instructions, so this job builds
    # portable artifacts under its own cache key. Valgrind itself is
    # single-threaded, so a GitHub-hosted runner suffices once that build is
    # cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || (github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', needs.prepare.outputs.pr) || needs.prepare.outputs.revision) }}
          persist-credentials: false

      - name: Verify test revision
        if: github.event_name != 'pull_request'
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TEST_REVISION" ]; then
            echo "::error::PR merge ref changed before the run started; comment !merge-tests again"
            exit 1
          fi

      - uses: ./.github/actions/setup-rust-toolchain
        with:
          native-codegen: "false"
      # `./.lake`, not `.lake`: the path string is hashed into the cache
      # entry's version, so the spelling must stay fixed for restores to hit.
      - uses: actions/cache@v6
        with:
          path: ./.lake
          key: lake-valgrind-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-valgrind-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false

      - name: Run FFI tests normally
        run: lake test --wfail -- ffi

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run tests under valgrind
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=.github/valgrind.supp \
            .lake/build/bin/IxTests ffi

  merge-gate:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' || needs.prepare.result != 'skipped')
    needs: [prepare, merge-tests, valgrind]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@v1
    with:
      job_results: ${{ toJSON(needs) }}

  report-merge-tests:
    name: Report merge tests
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      needs.prepare.result == 'success'
    needs: [prepare, merge-tests, valgrind, merge-gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Compose result comment
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          TEST_RESULT: ${{ needs.merge-tests.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
          GATE_RESULT: ${{ needs.merge-gate.result }}
        run: |
          if [ "$GATE_RESULT" = success ] && [ "$TEST_RESULT" = success ] && [ "$VALGRIND_RESULT" = success ]; then
            heading="## ✅ Merge tests passed"
            summary="All ignored test partitions and Valgrind passed"
          elif [ "$GATE_RESULT" = success ]; then
            heading="## ⏳ Merge tests awaiting Spot retry"
            summary="RunsOn will retry the failed jobs"
          elif [ "$GATE_RESULT" = cancelled ]; then
            heading="## ⚪ Merge tests cancelled"
            summary="The merge-test gate was cancelled"
          else
            heading="## ❌ Merge tests failed"
            summary="Tests failed or the merge-test gate could not verify their result"
          fi
          {
            echo "$heading"
            echo
            echo "$summary for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Update result comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ github.token }}
          issue-number: ${{ needs.prepare.outputs.pr }}
          comment-id: ${{ needs.prepare.outputs.comment-id }}
          edit-mode: replace
          body-path: comment-body.md

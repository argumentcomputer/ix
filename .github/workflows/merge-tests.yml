name: Merge tests

on:
  merge_group:
  # `!merge-tests` on a PR: the relay job dispatches this workflow on the
  # PR's branch, so the run carries the branch's ref. RunsOn files the
  # sticky-disk snapshot under the run's ref, and a comment event's ref is
  # the default branch; dispatching keeps a PR's build out of `main`'s
  # cache while still reading from it.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose test merge commit to run
        required: true

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Merge tests for PR #{0}', inputs.pr) || (github.event_name == 'issue_comment' && 'Relay merge-tests comment' || 'Merge tests') }}"

permissions:
  contents: read

# Each merge group must report its own result to the queue. A cancelled run
# cannot satisfy the required check, so runs are never superseded here.

jobs:
  relay:
    name: Relay !merge-tests comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '!merge-tests') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::PR number must be a positive integer"; exit 1; }
          read -r head_ref head_repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '"\(.head.ref) \(.head.repo.full_name)"')
          fail() {
            printf '%s\n' "$1" > comment-body.md
            gh pr comment "$PR_NUMBER" --body-file comment-body.md
            echo "::error::$1"
            exit 1
          }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] \
            || fail "Merge tests run on branches of this repository only; \`$head_repo\` is a fork."
          gh workflow run merge-tests.yml --ref "$head_ref" -f pr="$PR_NUMBER" 2> dispatch-error.txt \
            || fail "Could not dispatch merge tests on \`$head_ref\`: $(cat dispatch-error.txt). The branch needs this workflow's \`workflow_dispatch\` trigger; merge \`main\` into it and comment again."

  prepare:
    name: Prepare merge tests
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
      pr: ${{ steps.target.outputs.pr }}
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - name: Resolve test revision
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || { echo "::error::PR number must be a positive integer"; exit 1; }
            revision=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.merge_commit_sha // empty')
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            revision=$EVENT_SHA
          fi

          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::PR does not currently have a test merge commit"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Compose initial comment
        if: github.event_name == 'workflow_dispatch'
        env:
          MERGE_SHA: ${{ steps.target.outputs.revision }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          {
            echo "## ⏳ Merge tests running…"
            echo
            echo "Running the ignored test suite for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[In-progress logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Post initial comment
        if: github.event_name == 'workflow_dispatch'
        id: post
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ steps.target.outputs.pr }}
          body-path: comment-body.md

  merge-tests:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lake ignored tests (compile pipeline)
            kind: lake
            test_args: >-
              --ignored
              rust-canon-roundtrip serial-canon-roundtrip parallel-canon-roundtrip
              graph-cross condense-cross rust-serialize ixon-corpus
              rust-decompile validate-aux aux-gen-diff decompile-diff
              aux-gen-closure canon-closure-aux aux-cert
          # These are ignored runners: building IxTests or running the default
          # tests does not execute them. Keep the expensive validator and
          # schedule comparisons in their own partitions.
          - name: Lake ignored tests (compiler passes)
            kind: lake
            test_args: >-
              --ignored
              canon-pass1 twins clique-transport aux-oracle pass3 pass3-cliques
              o11a-decline compile-caller-independence
          - name: Lake ignored tests (compiler validation)
            kind: lake
            test_args: --ignored validate-lean validate-lean-nc
          - name: Lake ignored tests (compiler scheduling)
            kind: lake
            test_args: --ignored compile-schedule-identity compile-claim-conflict
          - name: Lake ignored tests (compiler closure and corpus)
            kind: lake
            test_args: --ignored compiler-selected-closure-e2e compile-closure-whole
            compiler_corpus: true
          - name: Lake ignored tests (compile)
            kind: lake
            test_args: --ignored compile
          - name: Lake ignored tests (decompile)
            kind: lake
            test_args: --ignored decompile
          - name: Lake ignored tests (misc)
            kind: lake
            test_args: >-
              --ignored
              shard-map catalog-dedup commit-io fidelity-initstd
              kernel-ixon-roundtrip kernel-tutorial kernel-check-env kernel-check-const
              rust-kernel-build-primitives rust-kernel-build-prim-origs ixvm
            zk_voting: true
          - name: Ix.Tc unit and parity tests
            kind: tc
            test_args: >-
              tc-anon-diff tc-init tc-tutorial tc-roundtrip tc-ingress-meta
              tc-pins tc-accel-diff
          - name: Certified kernel
            kind: kernel
    # On-demand rather than Spot: a reclaimed partition restarts from scratch
    # only after the whole attempt finishes, and the longest partitions
    # already run close to the merge queue's status-check timeout, so one
    # reclaim is enough to dequeue the PR.
    #
    # The sticky disk is ci.yml's lean-test lineage: same toolchain, same
    # portable codegen, same cached paths, and that job's push-to-main runs
    # are what keep the lineage's `main` snapshot fresh. A merge-queue ref
    # has no snapshot of its own and falls back to that one.
    runs-on: runs-on=${{ github.run_id }}-merge-tests-${{ github.run_attempt }}-${{ strategy.job-index }}/cpu=32/family=r7i+r8i+r7a+r8a/spot=false/image=ubuntu26-full-x64/volume=100gb/sticky=ci-lean-test-x86-64-v4:50gb/extras=s3-cache
    steps:
      - name: Validate merge-test variant
        env:
          TEST_KIND: ${{ matrix.kind }}
        run: |
          case "$TEST_KIND" in
            lake|tc|kernel) ;;
            *) echo "::error::Unknown merge-test variant: $TEST_KIND"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', needs.prepare.outputs.pr) || needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Verify test revision
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TEST_REVISION" ]; then
            echo "::error::PR merge ref changed before the run started; comment !merge-tests again"
            exit 1
          fi

      # sccache keys rustc outputs by content, so the workspace crates, which
      # cargo rebuilds after every fresh checkout because their mtimes moved,
      # come back as cache hits (see ci.yml).
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=target,path=Models/SetTheory/.lake
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: portable
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false

      - name: Run ignored Lake test partition
        if: ${{ matrix.kind == 'lake' }}
        run: lake test --wfail -- ${{ matrix.test_args }}

      - name: Run compiler corpus and checker-support controls
        if: matrix.compiler_corpus
        run: |
          lake build --wfail aux-shape-sweep checker-support-regression kernel-check-ixe
          lake exe aux-shape-sweep self-check
          lake exe checker-support-regression

      - name: Run ZK voting prover
        if: ${{ matrix.kind == 'lake' && matrix.zk_voting }}
        run: lake exe Apps.ZKVoting.Prover

      - name: Run Ix.Tc unit, parity, and regression tests
        if: ${{ matrix.kind == 'tc' }}
        run: |
          lake test --wfail -- tc-unit
          lake test --wfail -- --ignored ${{ matrix.test_args }}

      # The certified kernel gate (docs/kernel.md): the standalone IxC
      # package build, which has no dependencies and so proves the kernel needs
      # only the toolchain, then the host tests, the Rust differentials, the
      # set-theory model, the fences, the entry cases and the reader fidelity.
      # The kernel artifacts come from .lake/kernel on the sticky disk. The
      # model lives in its own workspace so Mathlib stays out of the root
      # package; its objects come from Mathlib's cache and persist on the
      # sticky disk, so a later run fetches nothing.
      - name: Fetch pinned set-theory dependencies
        if: ${{ matrix.kind == 'kernel' }}
        run: |
          lake -d Models/SetTheory exe cache get \
            Mathlib.SetTheory.Cardinal.Regular \
            Mathlib.SetTheory.ZFC.VonNeumann \
            Mathlib.SetTheory.ZFC.Cardinal
      - name: Check certified kernel, codec and order differentials, model, entry cases and reader fidelity
        if: ${{ matrix.kind == 'kernel' }}
        run: lake run check-kernel --with-model
      # The compiler-certification lane (Ix/CompileCert): its tracked axiom
      # audit (frozen roots, standard axioms only) and its fixture checks.
      - name: Check compiler-certification axiom audit and fixture checks
        if: ${{ matrix.kind == 'kernel' }}
        run: lake run check-cert

  valgrind:
    name: Valgrind FFI
    needs: prepare
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    # Valgrind cannot decode AVX-512, so this job builds generic artifacts and
    # keeps them in the S3-backed actions cache under their own key rather
    # than sharing a sticky disk with the x86-64-v4 partitions.
    runs-on: runs-on=${{ github.run_id }}-valgrind-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', needs.prepare.outputs.pr) || needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Verify test revision
        env:
          TEST_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$TEST_REVISION" ]; then
            echo "::error::PR merge ref changed before the run started; comment !merge-tests again"
            exit 1
          fi

      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          codegen: generic
      # `./.lake`, not `.lake`: the path string is hashed into the cache
      # entry's version, so the spelling must stay fixed for restores to hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.lake
          key: lake-valgrind-x64-generic-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lake-valgrind-x64-generic-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'rust-toolchain.toml') }}-
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false

      - name: Run FFI tests normally
        run: lake test --wfail -- ffi

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run tests under valgrind
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,possible \
            --errors-for-leak-kinds=definite \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=.github/valgrind.supp \
            .lake/build/bin/IxTests ffi

  merge-gate:
    if: ${{ always() && github.event_name != 'issue_comment' }}
    needs: [prepare, merge-tests, valgrind]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}

  report-merge-tests:
    name: Report merge tests
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.prepare.result == 'success'
    needs: [prepare, merge-tests, valgrind, merge-gate]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Compose result comment
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          TEST_RESULT: ${{ needs.merge-tests.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
          GATE_RESULT: ${{ needs.merge-gate.result }}
        run: |
          if [ "$GATE_RESULT" = success ] && [ "$TEST_RESULT" = success ] && [ "$VALGRIND_RESULT" = success ]; then
            heading="## ✅ Merge tests passed"
            summary="All test partitions and Valgrind passed"
          elif [ "$GATE_RESULT" = success ]; then
            heading="## ⏳ Merge tests awaiting Spot retry"
            summary="RunsOn will retry the failed jobs"
          elif [ "$GATE_RESULT" = cancelled ]; then
            heading="## ⚪ Merge tests cancelled"
            summary="The merge-test gate was cancelled"
          else
            heading="## ❌ Merge tests failed"
            summary="Tests failed or the merge-test gate could not verify their result"
          fi
          {
            echo "$heading"
            echo
            echo "$summary for PR #$PR_NUMBER at \`${MERGE_SHA:0:7}\`."
            echo
            echo "[Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment-body.md

      - name: Update result comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ needs.prepare.outputs.pr }}
          comment-id: ${{ needs.prepare.outputs.comment-id }}
          edit-mode: replace
          body-path: comment-body.md

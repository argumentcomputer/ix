name: Nix CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nix-test:
    name: Nix Tests
    env:
      # The dev shell builds with cargo directly, where `.cargo/config.toml`
      # would select native code generation; the sticky cache is shared
      # across instance families, so pin the same baseline CI uses.
      RUSTFLAGS: -Ctarget-cpu=x86-64-v4 -Ctarget-feature=+avx512vbmi2,+gfni
    # Sticky disks retain Lake/Cargo files; /nix uses the larger root volume
    # and Cachix provides its binary cache.
    # https://runs-on.com/docs/runners/capabilities/sticky-disks/
    runs-on: runs-on=${{ github.run_id }}-nix-test-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=150gb/sticky=nix-x86-64-v4:100gb/extras=s3-cache
    steps:
      - uses: actions/checkout@v7
      - uses: runs-on/action@v2
        with:
          sticky_cache: |
            rust
            custom,path=.lake,path=target
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Covers `builtins.fetchGit` of the Lake manifest's `git+https`
      # dependencies, which runs at flake eval time as this user;
      # `install-nix-action`'s github_access_token covers only `github:`
      # flake inputs, which fetch via the API.
      - uses: ./.github/actions/authenticate-github-fetches
      # Ix CLI
      - run: nix build --print-build-logs --accept-flake-config
      - run: nix run .#ix -- --help
      # A single invocation lets Nix schedule independent checks concurrently.
      - run: nix flake check --print-build-logs --accept-flake-config
      # Run the real build and test commands inside the development environment.
      - run: nix develop --accept-flake-config --command bash -c "lake build && lake test"
      # Realize the zkVM shells so they're verified and pushed to the cache,
      # and smoke-test each shell's toolchain entrypoint.
      # TODO: Re-enable once the zkVM shells build in CI.
      # - run: nix develop --print-build-logs --accept-flake-config .#zisk --command cargo-zisk --version
      # - run: nix develop --print-build-logs --accept-flake-config .#sp1 --command cargo prove --version

  nix-gate:
    if: ${{ always() }}
    needs: [nix-test]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@v1
    with:
      job_results: ${{ toJSON(needs) }}

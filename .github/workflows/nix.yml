name: Nix CI

on:
  pull_request:
  merge_group:
  # Pushes to main keep Cachix current with main's packages and dev shell.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nix-test:
    name: Nix Tests
    # Everything builds inside Nix's sandbox, so Cachix is the only cache;
    # /nix uses the larger root volume. The flake fixes its own code
    # generation, so any of the families will do.
    runs-on: runs-on=${{ github.run_id }}-nix-test-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=150gb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Covers `builtins.fetchGit` of the Lake manifest's `git+https`
      # dependencies, which runs at flake eval time as this user;
      # `install-nix-action`'s github_access_token covers only `github:`
      # flake inputs, which fetch via the API.
      - uses: $/.github/actions/authenticate-github-fetches
      # The flake's checks build the Ix library and the CLI, build the dev
      # shell and run its tools: a compatibility check of the Nix packaging
      # and the development environment. The tests run in CI Jobs.
      - run: nix flake check --print-build-logs --accept-flake-config
      - run: nix run --print-build-logs --accept-flake-config .#ix -- --help

  nix-gate:
    if: ${{ always() }}
    needs: [nix-test]
    permissions:
      actions: read
      checks: read
    uses: runs-on/spot-retry-gate/.github/workflows/merge-queue.yml@451eea7c3d2c58d14a1f80f0bbb99eaa347b9471 # v1.0.0
    with:
      job_results: ${{ toJSON(needs) }}

name: Benchmark main

# Benchmarks every push to main and uploads the results to bencher.dev.
# Each measurement is one `ix bench run` with a (backend, env)
# parameter combination — the same command you can run locally, and the
# same one the !benchmark PR workflow uses. Four job roles:
#
#   1. build     — compiles and caches `ix` once.
#   2. plan      — `ix bench ci matrix` prints the list of parameter
#                  combinations to run. The list comes from the registry
#                  (Ix/Cli/BenchCmd.lean) and each entry already carries
#                  its bencher testbed, so this file hardcodes none of that.
#   3. compile   — compiles each Lean env to a `.ixe` file (this IS the
#                  compile benchmark) and caches the file for `benchmark`.
#   4. benchmark — one job per remaining entry: restore the `.ixe` and
#                  run the entry's backend over it (ixvm, ixvm-ooc,
#                  decompile): the env's constant rows and its env row.
#
# Each entry uploads to its own bencher testbed. No regression thresholds
# are configured, so uploads raise no alerts. When the kernel REJECTS a
# constant, `ix bench run` exits 3 and that step fails visibly — but the
# clean rows still upload, because `ix bench bmf` drops every non-ok row
# (rejected or OOM) before the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: Benchmark main (r8i.8xlarge)

permissions:
  contents: read

# No concurrency group on purpose: every merged commit gets benchmarked,
# and a later merge must never cancel or queue behind an in-flight run.

env:
  IX_BENCH_MACHINE: r8i.8xlarge
  BENCH_CACHE: runs-on-r8i.8xlarge-native-v1
  COMPILE_DIR: Benchmarks/Compile

jobs:
  # Build the `ix` binary once and cache it; every later job restores it
  # instead of rebuilding. It is built
  # with native code generation for r8i, with caches and measured results
  # isolated from other hardware and compiler flags.
  build:
    # The sticky disk is the native-r8i lineage bench-pr's build job shares:
    # this push run leaves the lineage's `main` snapshot, which a
    # `!benchmark` run dispatched on its PR branch reads without writing.
    runs-on: runs-on=${{ github.run_id }}-build-${{ github.run_attempt }}/cpu=32/family=r8i.8xlarge/spot=false/image=ubuntu26-full-x64/volume=100gb/sticky=bench-build-r8i-native:50gb/extras=s3-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lake and cargo artifacts live on the sticky disk; sccache serves the
      # workspace crates cargo rebuilds after every fresh checkout (see
      # ci.yml), under entries the native codegen flags keep apart from CI's.
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sccache: s3
          sticky_cache: |
            rust
            custom,path=.lake,path=target
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Log build CPU
        uses: $/.github/actions/log-cpu
        with:
          label: Benchmark binary build CPU
      - uses: $/.github/actions/setup-rust-toolchain
        with:
          use-github-cache: "false"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          build-args: "ix --wfail -v"
          use-github-cache: false
      - run: |
          mkdir -p ~/.local/bin
          echo | lake run install            # copies ix -> ~/.local/bin/ix
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ${{ env.BENCH_CACHE }}-bench-bins-${{ github.sha }}

  # Ask the registry which benchmarks to run. `ix bench ci matrix` prints
  # one JSON entry per (backend, env) combination, each carrying its
  # own testbed — so nothing benchmark-
  # specific is written into this file. Runs in parallel with the compile
  # job; only the benchmark job waits on it.
  plan:
    needs: build
    # The restored `ix` contains native r8i code, including its Rust library.
    runs-on: runs-on=${{ github.run_id }}-plan-${{ github.run_attempt }}/cpu=32/family=r8i.8xlarge/spot=false/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ${{ env.BENCH_CACHE }}-bench-bins-${{ github.sha }}
          fail-on-cache-miss: true
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Provision the toolchain so `ix` finds libleanshared (no package build).
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - id: matrix
        run: |
          ix bench ci matrix > matrix.json
          cat matrix.json
          # Drop the compile entries: they run as their own job below,
          # because they produce the `.ixe` files everything else consumes
          # and GitHub cannot order entries within one matrix. Everything
          # else becomes the benchmark job's matrix.
          echo "matrix=$(jq -c 'map(select(.backend == "compile" | not))' matrix.json)" >> "$GITHUB_OUTPUT"

  # Compile each Lean env to a `.ixe` file. The compile itself is the
  # benchmark (compile time, throughput, env size); the `.ixe` is then
  # cached for the benchmark job to restore.
  compile:
    # Explicit name — the default would append every matrix value to the
    # job title.
    name: compile-${{ matrix.env }}
    needs: build
    # One sticky lineage per env: concurrent jobs on one lineage keep only
    # the last clean completion, so a shared disk would drop every other
    # env's Lake packages and oleans each run.
    runs-on: runs-on=${{ github.run_id }}-compile-${{ github.run_attempt }}-${{ strategy.job-index }}/cpu=32/family=r8i.8xlarge/spot=false/image=ubuntu26-full-x64/volume=100gb/sticky=bench-compile-${{ matrix.env }}-r8i-native:100gb/extras=s3-cache
    permissions:
      contents: read
      checks: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The env name (e.g. InitStd) is the one identifier used
        # everywhere: `ix bench run --env`, the `<env>.ixe` filename, the
        # lake target (Compile<env>), the cache-key suffix, and the
        # bencher row name. Every registry env compiles here; which envs
        # the benchmark job then proves/checks depends on which envs have
        # constants in Ix/BenchConstants.lean.
        include:
          - { env: InitStd }
          # Init+Std+Lean+Batteries. Batteries builds from the shared
          # Compile package; no mathlib cache needed.
          - { env: ISLB }
          - { env: Mathlib, mathlib: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compile workspace's `.lake` persists on the sticky disk: its
      # Lake packages, the Mathlib oleans `cache get` fetched, and the env's
      # own build, so later runs replay instead of refetching and rebuilding.
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        with:
          sticky_cache: |
            custom,path=${{ env.COMPILE_DIR }}/.lake
      # `lake build` below clones this package's Lake dependencies.
      - uses: $/.github/actions/authenticate-github-fetches
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ${{ env.BENCH_CACHE }}-bench-bins-${{ github.sha }}
      - name: Log compile CPU
        id: cpu
        uses: $/.github/actions/log-cpu
        with:
          label: Compile measurement CPU
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Install the Lean toolchain. The mathlib olean cache is fetched only
      # for the env that imports Mathlib — the shared
      # Benchmarks/Compile package depends on mathlib, so without this
      # guard InitStd/Lean would download it for nothing.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: ${{ env.COMPILE_DIR }}
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: ${{ matrix.mathlib && 'true' || 'false' }}
      - run: lake build Compile${{ matrix.env }} IxC.Kernel.PinGen.Certs
        working-directory: ${{ env.COMPILE_DIR }}
      # The measured compile: serializes the env to `<env>.ixe` at the
      # workspace root and writes one results row keyed by the env name.
      # For the compile backend the compile IS the benchmark, so it always
      # compiles fresh (`--ixe` is ignored on purpose). `bmf` converts the
      # row to bencher's upload format.
      - name: Run ix compile benchmark
        run: |
          .github/scripts/memory-cap ix bench run --backend compile --env ${{ matrix.env }} --out bench.json
          ix bench bmf --in bench.json --out benchmark.json
          cat benchmark.json
      # Ask the registry for this env's metadata (instead of keeping
      # hand-written env lists here):
      #   consumed — does any benchmark entry restore this env's `.ixe`?
      #              If yes, cache it below.
      #   testbed  — the upload testbed for this env's own compile benchmark.
      - id: gates
        name: Read this env's registry metadata
        run: |
          ix bench ci matrix > matrix.json
          gate() { jq --arg env "${{ matrix.env }}" "[.[] | select($1).env] | index(\$env) >= 0" matrix.json; }
          echo "consumed=$(gate '.backend == "compile" | not')" >> "$GITHUB_OUTPUT"
          meta() { jq -r --arg env "${{ matrix.env }}" "first(.[] | select(.backend == \"compile\" and .env == \$env)).$1" matrix.json; }
          echo "testbed=$(meta testbed)" >> "$GITHUB_OUTPUT"
      # Cache the `.ixe` for the benchmark job. IMPORTANT: every restore of
      # this key must list the same paths — cache versions include the
      # entry by its path list, so a mismatched list is unreachable
      # whatever the key. Keeping this entry to one path lets bench-pr's
      # base-side restore fall back to that workflow's compile-job key (a
      # stacked PR's base is a PR head, which never passes through here).
      - if: steps.gates.outputs.consumed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.env }}.ixe
          key: ${{ env.BENCH_CACHE }}-bench-ixe-${{ github.sha }}-${{ matrix.env }}
      # Record the host that measured this row. Bencher stores metric rows
      # only, so bench-pr restores this note by (SHA, parameters) to label a
      # bencher-sourced base side with its own hardware. Best-effort: a
      # missing entry renders as "not recorded".
      - name: Record measurement hardware
        if: ${{ !cancelled() }}
        env:
          HARDWARE: ${{ steps.cpu.outputs.summary }}
        run: printf '%s\n' "$HARDWARE" > bench-hardware.txt
      - name: Cache measurement hardware
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-hardware.txt
          key: ${{ env.BENCH_CACHE }}-bench-hardware-${{ github.sha }}-compile-${{ matrix.env }}
      # Upload the compile metrics to the testbed the registry names.
      - uses: $/.github/actions/bencher-track
        with:
          testbed: ${{ steps.gates.outputs.testbed }}
          file: benchmark.json
          key: ${{ secrets.BENCHER_API_KEY }}
          github-token: ${{ github.token }}

  # One job per remaining matrix entry, all sharing this one step list
  # (same shape as bench-pr.yml's benchmark job). Each entry brings its
  # own label and testbed. Every entry restores
  # the compile job's cached `.ixe` — nothing recompiles here.
  #
  # What each backend measures:
  #   - ixvm: the certified IxVM kernel executed in Aiur by `ix check`,
  #     one process per constant, no proving; the env row shards the env
  #     and executes it with one `ix check --ixes` across all cores.
  #   - ixvm-ooc: the same kernel run out-of-circuit and in parallel (much
  #     faster): one row per constant plus the whole-env row.
  #   - decompile: the inverse of compile. Roundtrip correctness is
  #     checked elsewhere (`ix validate` / roundtrip tests) — this only
  #     measures speed and memory.
  benchmark:
    name: ${{ matrix.params.label }}
    needs: [compile, plan]
    runs-on: runs-on=${{ github.run_id }}-benchmark-${{ github.run_attempt }}-${{ strategy.job-index }}/cpu=32/family=r8i.8xlarge/spot=false/image=ubuntu26-full-x64/volume=100gb/extras=s3-cache
    permissions:
      contents: read
      checks: write
    # `ix bench run` persists completed rows incrementally, so even a
    # job-level timeout keeps them on disk, but the bencher upload needs
    # the job alive.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        params: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ${{ env.BENCH_CACHE }}-bench-bins-${{ github.sha }}
      - name: Log run CPU
        id: cpu
        uses: $/.github/actions/log-cpu
        with:
          label: Benchmark measurement CPU
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Provision the toolchain so the staged binaries find libleanshared
      # (no package build). use-github-cache off: nothing to cache here, and
      # parallel matrix jobs share a key and would race the cache save.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: false
          use-github-cache: false
      # Pull the `.ixe` the compile job built — do NOT recompile here.
      # (The path list must match the compile job's save exactly.)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.params.env }}.ixe
          key: ${{ env.BENCH_CACHE }}-bench-ixe-${{ github.sha }}-${{ matrix.params.env }}
          fail-on-cache-miss: true
      # If the kernel rejects a constant, `ix bench run` exits 3 and this
      # step fails — that is a correctness regression, not a benchmark
      # blip. The completed rows are already on disk for the upload below.
      # memory-cap runs it in a cgroup capped at the runner's RAM minus 15 GiB,
      # swap off: an OOM kill lands on the measured tool, not `ix bench run`.
      - name: Run ${{ matrix.params.label }} benchmark
        run: >-
          .github/scripts/memory-cap ix bench run --backend ${{ matrix.params.backend }}
          --env ${{ matrix.params.env }}
          --ixe ${{ matrix.params.env }}.ixe --out bench.json
      # The ixvm-ooc env row writes a per-constant attribution CSV next to its
      # results file. Bencher stores metric rows only, so cache the CSV by
      # (SHA, cell) — bench-pr restores it to render the per-constant
      # drill-down against a bencher-fetched main side (PR runs can read
      # caches created on main). Best-effort: an evicted or missing entry
      # just means the drill-down falls back to base-run-only availability.
      - name: Cache per-constant attribution CSV
        if: ${{ !cancelled() && matrix.params.backend == 'ixvm-ooc' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench.json.perconst.csv
          key: ${{ env.BENCH_CACHE }}-bench-perconst-${{ github.sha }}-${{ matrix.params.backend }}-${{ matrix.params.env }}
      # The measurement host, by (SHA, parameters), for bench-pr to label a
      # bencher-sourced base side — same best-effort contract as the CSV.
      - name: Record measurement hardware
        if: ${{ !cancelled() }}
        env:
          HARDWARE: ${{ steps.cpu.outputs.summary }}
        run: printf '%s\n' "$HARDWARE" > bench-hardware.txt
      - name: Cache measurement hardware
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-hardware.txt
          key: ${{ env.BENCH_CACHE }}-bench-hardware-${{ github.sha }}-${{ matrix.params.backend }}-${{ matrix.params.env }}
      # Convert rows for upload even when the run step failed: bmf drops
      # every non-ok row (rejected or OOM), so only clean measurements
      # reach bencher. bmf exits nonzero when NO ok rows survive — the
      # steady state for a cell whose only constant exceeds the RAM
      # ceiling (the OOM row documents the gap) — so that skips the
      # upload without failing the job; the run step above is the
      # failure authority. The `cat` still fails the step when bmf died
      # before writing a file (a real infrastructure error).
      - name: Convert to Bencher Metric Format
        id: bmf
        if: ${{ !cancelled() }}
        run: |
          if ix bench bmf --in bench.json --out bench-bmf.json; then
            echo "nonempty=true" >> "$GITHUB_OUTPUT"
          else
            echo "nonempty=false" >> "$GITHUB_OUTPUT"
          fi
          cat bench-bmf.json
      # Upload under this entry's testbed.
      - uses: $/.github/actions/bencher-track
        if: ${{ !cancelled() && steps.bmf.outputs.nonempty == 'true' }}
        with:
          testbed: ${{ matrix.params.testbed }}
          file: bench-bmf.json
          key: ${{ secrets.BENCHER_API_KEY }}
          github-token: ${{ github.token }}

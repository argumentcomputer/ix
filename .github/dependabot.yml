version: 2
# Monthly schedules and cooldowns apply only to routine version updates.
# Security updates and grouping are enabled in repository settings: alerts
# with available fixes trigger security PRs immediately, without waiting
# for the monthly schedule or cooldown.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    pull-request-branch-name:
      separator: "-"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Create separate pull requests for major vs minor/patch version updates, as major bumps will likely introduce breaking changes and Dependabot will put each one in its own PR.
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    # "/" is a special case meaning `.github/workflows/`; composite action
    # directories must be listed separately for their dependencies to be seen
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

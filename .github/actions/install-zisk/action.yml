name: Install Zisk
description: >-
  Install the system build deps, the ZisK zkVM toolchain (ziskup, CPU build),
  and — unless `proving-key: false` — the fork-matching proving key used for
  proof generation. Build and execute-only callers can skip the few-GB
  download and const-tree regeneration. Assumes a Rust toolchain is already
  set up.

inputs:
  proving-key:
    description: >-
      Install the fork-matching proving key. Required to prove, but not to
      build or use the SDK's execute-only client.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The shared zkVM apt superset — the ZisK book's full Ubuntu list (prebuilt
    # cargo-zisk + proofman's C++ link OpenMPI/OpenMP/GMP/nlohmann-json/nasm/
    # secp256k1/…), kept identical to install-sp1 so a host that links both is
    # covered. The Nix shells provided this; a bare runner doesn't.
    - name: Install system build deps
      shell: bash
      run: |
        # Some warpbuild images ship an unreachable azure mirror that hangs
        # `apt-get update`; drop it first (no-op elsewhere).
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
        export DEBIAN_FRONTEND=noninteractive
        # The Ubuntu EC2 mirrors sporadically 502 / throttle on these large
        # fetches (qemu-system alone pulls hundreds of MB), so retry the whole
        # update+install: `Acquire::Retries` absorbs single-download blips and
        # `--fix-missing` resumes a partially fetched set.
        for attempt in 1 2 3; do
          sudo apt-get update || true
          if sudo apt-get install -y --fix-missing -o Acquire::Retries=5 \
            xz-utils jq curl build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev \
            libsecp256k1-dev libsodium-dev libpqxx-dev nasm libopenmpi-dev \
            openmpi-bin openmpi-common libclang-dev clang gcc-riscv64-unknown-elf \
            pkg-config libssl-dev; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::apt-get install failed after 3 attempts"; exit 1
          fi
          echo "::warning::apt-get install attempt $attempt failed; retrying in $((attempt * 10))s"
          sleep $((attempt * 10))
        done
    # Host links the argumentcomputer/zisk fork (check-setup lives in the
    # `cargo-zisk-dev` binary, used below to regenerate the key's
    # const-trees). `--cpu` picks
    # the CPU build (no GPU on the runner) and `--nokey` skips ziskup's key
    # install — both avoid its interactive /dev/tty prompts. We keep `--nokey`
    # because the upstream `zisk-setup` bucket only carries the upstream circuit's
    # key; our fork has a different circuit (extra Blake3f AIR), so we restore the
    # fork-matching key from our own S3 in the next step. `--prefix $HOME/.zisk`
    # pins the install where cargo-zisk's ZiskPaths fallback looks (the runner
    # sets XDG_CONFIG_HOME, which would otherwise relocate it).
    - name: Install Zisk toolchain (ziskup)
      shell: bash
      run: |
        # Both pins track the argumentcomputer/zisk fork the guests build
        # against (`blake3-precompile-1.0.0-alpha`) and must move with it.
        #
        # cargo-zisk 1.0.0-alpha matches the fork's `zisk-sdk` / `ziskos` and the
        # proving key restored below. Unpinned, ziskup takes the newest release,
        # whose `cargo-zisk toolchain install` also stopped honoring
        # `releases/latest` in favor of the highest tag of a tracked major.
        #
        # zisk-0.5.1 is the last Rust toolchain whose `riscv64ima-zisk-zkvm-elf`
        # target spec embeds the guest memory-layout linker script
        # (`link_script: Some(LINKER_SCRIPT)`), which defines `_global_pointer`,
        # `_init_stack_top` and the `_kernel_heap_*` symbols that `ziskos::_start`
        # references. zisk-1.0.0 dropped it; upstream instead ships the script in
        # `ziskbuild` and passes it as `-C link-arg=-T`, machinery that landed in
        # zisk 1.1.0-alpha and so is absent from the 1.0.0-alpha fork. Any newer
        # toolchain therefore fails the guest link with those symbols undefined.
        # Unpin only alongside a fork rebase that carries ziskbuild's script.
        #
        # ziskup ends by running `cargo-zisk toolchain install` itself, which
        # breaks whenever upstream publishes a release tag before uploading its
        # assets. Tolerate that one failure (it is ziskup's last material step
        # under --nokey) and redo the toolchain install pinned; the follow-up
        # command still fails the job if ziskup died earlier (no cargo-zisk
        # binary) or the download itself breaks.
        curl -L https://raw.githubusercontent.com/0xPolygonHermez/zisk/main/ziskup/install.sh \
          | bash -s -- --cpu --nokey -y --prefix "$HOME/.zisk" --version 1.0.0-alpha || true
        "$HOME/.zisk/bin/cargo-zisk" toolchain install --toolchain-version zisk-0.5.1
        echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"
    # Pre-build the proofman C++ sys crate ALONE so its build script runs
    # exactly once before any parallel zisk-host build. zisk-host pulls
    # zisk-sdk as both a dependency and a build-dependency, so cargo compiles
    # proofman-starks-lib-c as two units whose build scripts can run
    # CONCURRENTLY — and both run `make` inside the SHARED
    # ~/.cargo/git/checkouts/pil2-proofman-* source dir. On a cold runner the
    # Makefile stamp is absent, so both units take the `make clean` +
    # `make -j` path and race: one unit's clean deletes build/ while the
    # other's g++ is mid-compile ("opening dependency file ….d: No such file
    # or directory"). Building the crate solo writes the stamp; the second
    # unit then skips the clean and its `make -j` is a no-op.
    # (Proper fix is an flock in pil2-proofman's build.rs — upstream.)
    - name: Pre-build proofman-starks-lib-c (serialize the shared make)
      shell: bash
      run: cargo build --release -p proofman-starks-lib-c
      working-directory: zisk
    # Proof generation needs the fork-matching proving key. It lives in a
    # public S3 bucket
    # WITHOUT the const-trees — exactly like Zisk's released
    # `zisk-provingkey-*.tar.gz` on `storage.googleapis.com/zisk-setup` — and
    # regenerate them here with `cargo-zisk-dev check-setup -a`, which is how
    # `ziskup` itself populates them. That keeps the artifact a few GB (gzip)
    # instead of ~50 GB (the tarball also omits the `*_gpu` const variants the
    # first GPU prove would materialize — unused on this CPU runner). The
    # object name carries the fork rev so a circuit change can't silently
    # reuse a stale key. `aws s3 cp` (multipart, no creds — public bucket)
    # holds throughput steady where a single-stream `curl` swings by an
    # order of magnitude; `curl` is the fallback for hosts without the AWS
    # CLI. Deliberately NOT actions/cache'd: the runner fleet is AWS-hosted,
    # so multipart S3 outruns the Actions cache service — and the tarball
    # would crowd the repo's cache quota besides.
    - name: Fetch proving key from S3, extract, regenerate const-trees
      if: inputs.proving-key == 'true'
      shell: bash
      run: |
        object=zisk-provingkey-blake3-e4057c4c-cpu.tar.gz
        tarball="${RUNNER_TEMP:-/tmp}/$object"
        if command -v aws >/dev/null 2>&1; then
          aws configure set default.s3.max_concurrent_requests 20
          aws s3 cp --no-sign-request --region us-east-1 \
            "s3://argument-zisk-setup/$object" "$tarball"
        else
          curl -fSL --retry 3 \
            "https://argument-zisk-setup.s3.amazonaws.com/$object" -o "$tarball"
        fi
        mkdir -p "$HOME/.zisk"
        tar -C "$HOME/.zisk" -xzf "$tarball"
        rm -f "$tarball"
        # Regenerate the const-trees omitted from the artifact (CPU build →
        # no --gpu). ziskup's "may take a while" step.
        cargo-zisk-dev check-setup --proving-key "$HOME/.zisk/provingKey" -a

name: Track benchmarks on bencher
description: >-
  Run `bencher run` for the `ix` project, uploading one Bencher Metric
  Format file to a testbed on the current branch. No regression thresholds
  are configured, so the upload raises no alerts.

inputs:
  testbed:
    description: Bencher testbed slug.
    required: true
  file:
    description: Bencher Metric Format JSON file to upload.
    required: true
  key:
    description: BENCHER_API_KEY (project-scoped `bencher_run_*` or user-scoped `bencher_user_*`).
    required: true
  github-token:
    description: GITHUB_TOKEN, for the --github-actions comment.
    required: true

runs:
  using: composite
  steps:
    - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
    - shell: bash
      env:
        BENCHER_KEY: ${{ inputs.key }}
        GH_TOKEN: ${{ inputs.github-token }}
        TESTBED: ${{ inputs.testbed }}
        FILE: ${{ inputs.file }}
      run: |
        # `--thresholds-reset` with no `--threshold-*` flags removes any
        # threshold earlier runs left on these measures, so nothing alerts.
        bencher run \
          --project ix \
          --key "$BENCHER_KEY" \
          --branch "$GITHUB_REF_NAME" \
          --hash "$GITHUB_SHA" \
          --testbed "$TESTBED" \
          --adapter json \
          --github-actions "$GH_TOKEN" \
          --thresholds-reset \
          --file "$FILE"

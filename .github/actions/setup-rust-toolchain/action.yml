name: Set up Rust toolchain
description: >-
  Install Rust on Warp Linux x64, configure compiler flags, and cache Cargo
  artifacts.

inputs:
  cache-workspaces:
    description: Cargo workspaces to cache
    required: false
  native-codegen:
    description: Enable code generation for the runner's native CPU
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require Warp Linux x64 runner
      shell: bash
      env:
        IX_RUNNER_NAME: ${{ runner.name }}
        IX_RUNNER_OS: ${{ runner.os }}
        IX_RUNNER_ARCH: ${{ runner.arch }}
      run: |
        if [[ "$IX_RUNNER_NAME" != warp-* || "$IX_RUNNER_OS" != Linux || "$IX_RUNNER_ARCH" != X64 ]]; then
          echo "::error::setup-rust-toolchain requires a Warp Linux x64 runner; got name=$IX_RUNNER_NAME os=$IX_RUNNER_OS arch=$IX_RUNNER_ARCH"
          exit 1
        fi

    - uses: ./.github/actions/authenticate-github-fetches

    # Cargo's built-in git fetcher ignores `url.insteadOf`, so it would bypass
    # the token rewrite above; fetching with the git CLI routes cargo's git
    # dependencies through it. Set before the caching action below, which
    # keys on the environment.
    - name: Fetch cargo git dependencies with the git CLI
      shell: bash
      run: |
        if [[ ! -v CARGO_NET_GIT_FETCH_WITH_CLI ]]; then
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        fi

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ${{ inputs.native-codegen == 'true' && '-Ctarget-cpu=native -Dwarnings' || '-Dwarnings' }}
        # `target/` may contain host-executed native code. Every caller runs
        # within the Warp x64 compatibility domain.
        cache-key: warp-x64
        cache-workspaces: ${{ inputs.cache-workspaces }}

name: Set up Rust toolchain
description: >-
  Install Rust on supported Linux x64 runners, configure compiler flags, and
  optionally cache Cargo artifacts.

inputs:
  cache-workspaces:
    description: Cargo workspaces to cache
    required: false
  use-github-cache:
    description: Enable the setup action's Cargo cache
    required: false
    default: "true"
  cache-provider:
    description: Cache provider used by the Rust setup action
    required: false
    default: github
  avx512-codegen:
    description: Enable portable AVX-512 code generation for supported x64 runners
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require supported Linux x64 runner
      shell: bash
      env:
        IX_RUNNER_NAME: ${{ runner.name }}
        IX_RUNNER_OS: ${{ runner.os }}
        IX_RUNNER_ARCH: ${{ runner.arch }}
      run: |
        if [[ "$IX_RUNNER_OS" != Linux || "$IX_RUNNER_ARCH" != X64 || \
              ("$IX_RUNNER_NAME" != warp-* && "$IX_RUNNER_NAME" != nsc-runner-*) ]]; then
          echo "::error::setup-rust-toolchain requires a Warp or Namespace Linux x64 runner; got name=$IX_RUNNER_NAME os=$IX_RUNNER_OS arch=$IX_RUNNER_ARCH"
          exit 1
        fi

    - uses: ./.github/actions/authenticate-github-fetches

    # Cargo's built-in git fetcher ignores `url.insteadOf`, so it would bypass
    # the token rewrite above; fetching with the git CLI routes cargo's git
    # dependencies through it. Set before the caching action below, which
    # keys on the environment.
    - name: Fetch cargo git dependencies with the git CLI
      shell: bash
      run: |
        if [[ ! -v CARGO_NET_GIT_FETCH_WITH_CLI ]]; then
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        fi

    # The supported fleets mix Intel and AMD hosts, and cached artifacts may
    # be built on one CPU model and consumed on another. Neither vendor's
    # feature set contains the other's, so `-Ctarget-cpu=native` is not
    # portable across the fleet: Zen 5 enables SSE4A, which LLVM emits (as
    # INSERTQ, in witness generation) and Intel traps on with #UD. Pin the
    # measured intersection instead. x86-64-v4 covers every AVX-512 subset Plonky3
    # uses; +avx512vbmi2 keeps its VPSHRDQ interleave and +gfni keeps LLVM's
    # byte-shift lowering. blake3 selects its kernels via CPUID at runtime
    # and is unaffected. Pinning also makes codegen host-independent, so the
    # cache key below is sound and main-vs-PR timings stay comparable.
    - name: Require the fleet's baseline CPU features
      if: inputs.avx512-codegen == 'true'
      shell: bash
      run: |
        missing=()
        for f in avx512f avx512bw avx512cd avx512dq avx512vl avx512_vbmi2 gfni; do
          grep -qw "$f" /proc/cpuinfo || missing+=("$f")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Runner CPU lacks required feature(s): ${missing[*]}. Binaries are built for x86-64-v4 +avx512vbmi2,+gfni."
          exit 1
        fi

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ${{ inputs.avx512-codegen == 'true' && '-Ctarget-cpu=x86-64-v4 -Ctarget-feature=+avx512vbmi2,+gfni -Dwarnings' || '-Dwarnings' }}
        cache: ${{ inputs.use-github-cache }}
        cache-provider: ${{ inputs.cache-provider }}
        cache-key: ${{ inputs.avx512-codegen == 'true' && 'x64-avx512' || 'x64-portable' }}
        cache-workspaces: ${{ inputs.cache-workspaces }}

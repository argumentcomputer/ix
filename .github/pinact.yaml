version: 3
# All external actions (including internal argumentcomputer/* actions) must be
# pinned to full 40-character commit SHAs (enforced by `.github/zizmor.yml` and
# here). `argumentcomputer/lean-update` and `argumentcomputer/ci-workflows` have
# no release tags, so exempt them from pinact's version-comment verification
# ONLY when pinned to a full 40-char commit SHA.
rules:
  - ignore: true
    conditions:
      - expr: ActionName == "argumentcomputer/lean-update" && ActionVersion matches "^[0-9a-f]{40}$"
      - expr: ActionName matches "^argumentcomputer/ci-workflows/" && ActionVersion matches "^[0-9a-f]{40}$"

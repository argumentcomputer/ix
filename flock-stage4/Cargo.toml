[workspace]
members = ["circuit", "fflonk", "trace"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ark-poly = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = ["std"] }
blake3 = "1.8.4"
ix-stage4-trace = { path = "trace" }
ix-terminal-circuit = { path = "circuit" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[workspace.lints.rust]
invalid_reference_casting = "warn"
nonstandard_style = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_ok_or = "warn"
type_complexity = "allow"

name = "Compile"
version = "0.1.0"
defaultTargets = ["CompileInitStd"]

[[lean_lib]]
name = "CompileInit"

[[lean_lib]]
name = "CompileInitStd"

[[lean_lib]]
name = "CompileLean"

[[lean_lib]]
name = "CompileMathlib"

[[lean_lib]]
name = "CompileBatteries"

[[lean_lib]]
name = "CompileISLB"

[[lean_lib]]
name = "CompileRedStep"

[[lean_lib]]
name = "CompileFLT"

[[lean_lib]]
name = "CompileAnthropicFLT"

[[lean_lib]]
name = "CompileMutualFixtures"

[[lean_lib]]
name = "TorchLean"

[[require]]
name = "ix"
path = "../.."

[[require]]
name = "flt"
git = "https://github.com/ImperialCollegeLondon/FLT"
rev = "v4.33.0"

[[require]]
name = "flt_e2e"
git = "https://github.com/anthropics/fermats-last-theorem"
rev = "aa2d8b34692b16c70f699536de0d8e75b9a3e9ef"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "75c0681bd37567af00e8f0bd13fd59f1423e4217"

[[require]]
name = "TorchLean"
git = "https://github.com/lean-dojo/TorchLean"
rev = "fa6bbe3bf0d93679422be8a14978c26ee55d98ff"

[[require]]
name = "phi-confluence"
git = "https://github.com/objectionary/proof"
rev = "58aa7731076d02bf51b2dfbcdc06c4f764101fb4"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "afb1aacb3632d3236eee756ea1683290c07270a3"

# Keep the workspace's Lean 4.33 dependency closure authoritative over
# older or moving transitive Mathlib pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

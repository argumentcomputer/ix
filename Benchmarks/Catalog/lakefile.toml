name = "Catalog"
version = "0.1.0"

# Catalog conflict corpus (ported from TruthMinesLib
# fixtures/RelocFixture{A,B}): two packages that deliberately export
# colliding `Collision.*` names — near-twins that must NOT dedup
# (different bodies), identical shapes that MUST dedup (`Tree.map`),
# and a declaration-kind matrix (mutual inductives, structures,
# classes, axioms, noncomputable/meta/partial/unsafe defs, opaques
# with `implemented_by`, `@[extern]`, `@[no_expose]`) — plus a
# cross-package dependency (`FixtureA.UsesB` references
# `FixtureB.*`) that forces owner-aware relocation.
#
# Consumed by `lake test -- --ignored catalog-fixtures` (which builds
# this workspace first) and by manual `ix catalog` runs with this
# directory as cwd.

[[require]]
name = "relocFixtureA"
path = "RelocFixtureA"

[[require]]
name = "relocFixtureB"
path = "RelocFixtureB"

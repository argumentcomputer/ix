name = "CatalogSpine"
version = "0.1.0"

# Mathlib-spine catalog benchmark (plan Item 8 / I8): a catalog whose
# members share one heavy closure — mathlib — so the streaming
# loader's construction-memory bound is observable. Peak RSS must be
# ~1× the heavy closure, not ~N×: before streaming (#569-shape
# `resolveLibs`), every mathlib-dependent member held its own copy of
# the mathlib environment simultaneously, which `Benchmarks/
# CatalogReal` cannot exhibit (its members barely share closures).
#
# Members: mathlib's own dependency spine (every non-toolchain package
# in any member's import closure needs a catalog entry), Mathlib
# itself, and three small real-corpus mathlib dependents (BET,
# GibbsMeasure, kolmogorov_extension4) whose environments each contain
# the full mathlib closure. Revs are the TruthMines corpus pins
# (Lean v4.33.0).
#
# Manual-run territory like CatalogReal: needs network on first
# fetch, and run `lake exe cache get` before `lake build` to avoid a
# from-source mathlib build. Consumed by
# `lake test -- --ignored catalog-spine` (which needs
# `lake build ix` first) and by manual `ix catalog` runs with this
# directory as cwd.

